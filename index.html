<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ – Help Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ───────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Light tokens ────────────────────────────────────────────────── */
    :root {
      --bg:           #F2EDE3;
      --surface:      #FFFFFF;
      --navy:         #1C2D6E;
      --navy-90:      rgba(28,45,110,.90);
      --navy-60:      rgba(28,45,110,.60);
      --navy-30:      rgba(28,45,110,.30);
      --navy-12:      rgba(28,45,110,.12);
      --navy-06:      rgba(28,45,110,.06);
      --border:       rgba(28,45,110,.18);
      --accent:       #2B4DB3;
      --accent-light: rgba(43,77,179,.10);
      --green:        #16a34a;
      --green-light:  #dcfce7;
      --green-border: #86efac;
      --red:          #dc2626;
      --red-light:    #fee2e2;
      --highlight:    #fef08a;
      --font:         'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --ease-out:     cubic-bezier(0.22, 1, 0.36, 1);
      --ease-in-out:  cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Dark tokens ─────────────────────────────────────────────────── */
    :root[data-theme="dark"] {
      --bg:           #0D1B3E;
      --surface:      #162248;
      --navy:         #D4DCF5;
      --navy-90:      rgba(212,220,245,.90);
      --navy-60:      rgba(212,220,245,.60);
      --navy-30:      rgba(212,220,245,.30);
      --navy-12:      rgba(212,220,245,.10);
      --navy-06:      rgba(212,220,245,.05);
      --border:       rgba(212,220,245,.14);
      --accent:       #7B9FFF;
      --accent-light: rgba(123,159,255,.15);
      --green:        #4ade80;
      --green-light:  rgba(74,222,128,.12);
      --green-border: rgba(74,222,128,.35);
      --red:          #f87171;
      --red-light:    rgba(248,113,113,.12);
      --highlight:    rgba(254,240,138,.20);
    }

    html { scroll-behavior: smooth; font-size: 16px; }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: var(--font);
      color: var(--navy);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 300ms ease, color 300ms ease;
    }

    /* ── Hero ────────────────────────────────────────────────────────── */
    .hero {
      position: relative;
      overflow: hidden;
      padding: 3rem 1.5rem 3.5rem;
      background:
        radial-gradient(circle, var(--navy-12) 1px, transparent 1px),
        var(--bg);
      background-size: 28px 28px, auto;
      border-bottom: 1px solid var(--border);
      transition: background 300ms ease, border-color 300ms ease;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 0%, transparent 50%, var(--bg) 100%);
      pointer-events: none;
      transition: background 300ms ease;
    }

    .hero__inner {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
    }

    /* ── Theme toggle ────────────────────────────────────────────────── */
    .theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--navy-06);
      color: var(--navy-60);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        background    180ms ease,
        border-color  180ms ease,
        color         180ms ease,
        transform     120ms ease,
        box-shadow    180ms ease;
      z-index: 2;
    }

    .theme-toggle:hover {
      background: var(--navy-12);
      border-color: var(--navy-30);
      color: var(--navy);
      box-shadow: 0 2px 8px var(--navy-12);
    }

    .theme-toggle:active { transform: scale(.9); }
    .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .theme-toggle svg { width: 17px; height: 17px; }

    .hero__badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      border: 1.5px solid var(--navy);
      border-radius: 999px;
      padding: .25rem .85rem;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--navy);
      margin-bottom: 1.25rem;
      background: transparent;
      transition: border-color 300ms ease, color 300ms ease;
    }

    .hero__badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--navy);
      animation: pulse 2s ease-in-out infinite;
      transition: background 300ms ease;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.4); opacity: .6; }
    }

    .hero__title {
      font-size: clamp(2.25rem, 6vw, 3.75rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -.03em;
      color: var(--navy);
      margin-bottom: .75rem;
      transition: color 300ms ease;
    }

    .hero__sub {
      font-size: 1.05rem;
      color: var(--navy-60);
      max-width: 480px;
      margin-bottom: 2rem;
    }

    /* ── Search ──────────────────────────────────────────────────────── */
    .search-wrap { position: relative; max-width: 540px; }

    .search-icon {
      position: absolute;
      left: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--navy-60);
      width: 18px;
      height: 18px;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: .9rem 7rem .9rem 2.9rem;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(8px);
      font-family: var(--font);
      font-size: .975rem;
      color: var(--navy);
      box-shadow: 0 2px 8px var(--navy-12);
      transition:
        border-color 200ms var(--ease-in-out),
        box-shadow   200ms var(--ease-in-out),
        background   300ms ease;
      outline: none;
      appearance: none;
    }

    :root[data-theme="dark"] .search-input {
      background: rgba(22,34,72,.9);
      color: var(--navy);
    }

    .search-input::placeholder { color: var(--navy-30); }
    .search-input::-webkit-search-cancel-button { display: none; }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-light), 0 2px 8px var(--navy-12);
    }

    .search-clear {
      position: absolute;
      right: 4.5rem;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border: none;
      background: var(--navy-12);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--navy-60);
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease, background 150ms ease, color 150ms ease, transform 100ms ease;
    }

    .search-clear.visible { opacity: 1; pointer-events: auto; }
    .search-clear:hover { background: var(--navy-30); color: var(--navy); }
    .search-clear:active { transform: translateY(-50%) scale(.9); }
    .search-clear svg { width: 12px; height: 12px; }

    .search-hint {
      position: absolute;
      right: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .kbd {
      display: inline-block;
      background: rgba(255,255,255,.7);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: .7rem;
      font-family: var(--font);
      color: var(--navy-60);
      padding: .1rem .4rem;
      line-height: 1.5;
      font-weight: 600;
    }

    :root[data-theme="dark"] .kbd { background: rgba(255,255,255,.06); }

    /* ── Content wrapper ─────────────────────────────────────────────── */
    .content { max-width: 720px; margin: 0 auto; padding: 0 1.5rem 6rem; }

    /* ── Category Filter Tabs ────────────────────────────────────────── */
    .categories {
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
      padding: 1.75rem 0 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .cat-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      font-family: var(--font);
      font-size: .82rem;
      font-weight: 600;
      color: var(--navy-60);
      padding: .35rem .9rem;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease, transform 100ms ease, box-shadow 180ms ease;
    }

    .cat-btn:hover { background: var(--navy-06); border-color: var(--navy-30); color: var(--navy); }
    .cat-btn:active { transform: scale(.96); }
    .cat-btn.active { background: var(--navy); border-color: var(--navy); color: #fff; box-shadow: 0 2px 8px var(--navy-30); }
    .cat-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .cat-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 .4rem;
      border-radius: 999px;
      font-size: .68rem;
      font-weight: 700;
      background: var(--navy-12);
      color: var(--navy-60);
      transition: background 180ms ease, color 180ms ease;
    }

    .cat-btn.active .cat-count { background: rgba(255,255,255,.25); color: #fff; }

    /* ── Toolbar (results meta + expand all) ─────────────────────────── */
    .faq-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .9rem 0 .1rem;
      min-height: 2.5rem;
    }

    .results-meta {
      font-size: .82rem;
      font-weight: 500;
      color: var(--navy-60);
    }

    .expand-all-btn {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      font-family: var(--font);
      font-size: .78rem;
      font-weight: 600;
      color: var(--navy-60);
      padding: .3rem .85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 100ms ease;
      flex-shrink: 0;
    }

    .expand-all-btn svg { width: 12px; height: 12px; flex-shrink: 0; }
    .expand-all-btn:hover { background: var(--navy-06); border-color: var(--navy-30); color: var(--navy); }
    .expand-all-btn:active { transform: scale(.95); }
    .expand-all-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── FAQ list & item ─────────────────────────────────────────────── */
    .faq-list { border-top: 1px solid var(--border); }

    .faq-item {
      border-bottom: 1px solid var(--border);
      opacity: 1;
      transform: translateY(0);
      transition: opacity 300ms var(--ease-out), transform 300ms var(--ease-out);
      scroll-margin-top: 1.5rem;
    }

    .faq-item--entering { opacity: 0; transform: translateY(8px); }

    /* ── Trigger ─────────────────────────────────────────────────────── */
    .faq-trigger {
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 1.4rem 0;
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      text-align: left;
      color: var(--navy);
    }

    .faq-trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    .faq-question {
      font-size: 1.0rem;
      font-weight: 700;
      line-height: 1.45;
      color: var(--navy);
      flex: 1;
      transition: color 150ms ease;
    }

    .faq-item:hover .faq-question { color: var(--accent); }

    .faq-icon {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: .1rem;
      background: transparent;
      transition: background 200ms ease, border-color 200ms ease;
      color: var(--navy);
    }

    .faq-item:hover .faq-icon { background: var(--navy-06); border-color: var(--navy-30); }
    .faq-item.is-open .faq-icon { background: var(--navy); border-color: var(--navy); color: #fff; }
    .faq-icon svg { width: 12px; height: 12px; }
    .faq-icon-v { transition: transform 300ms var(--ease-in-out), opacity 300ms ease; }
    .faq-item.is-open .faq-icon-v { transform: rotate(90deg); opacity: 0; }

    /* ── Accordion body ──────────────────────────────────────────────── */
    .faq-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 350ms var(--ease-in-out);
    }

    .faq-item.is-open .faq-body { grid-template-rows: 1fr; }
    .faq-body-inner { overflow: hidden; }
    .faq-answer-wrap { padding-bottom: 1.5rem; }

    .faq-answer {
      font-size: .97rem;
      color: var(--navy-90);
      line-height: 1.75;
      max-width: 600px;
    }

    /* ── Action row ──────────────────────────────────────────────────── */
    .faq-actions {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin: 1.1rem 0 1.25rem;
      flex-wrap: wrap;
    }

    /* Shared pill-button base */
    .action-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      font-family: var(--font);
      font-size: .8rem;
      font-weight: 600;
      color: var(--navy-60);
      padding: .42rem 1rem;
      cursor: pointer;
      transition:
        background    160ms ease,
        border-color  160ms ease,
        color         160ms ease,
        box-shadow    160ms ease,
        transform     100ms ease;
      user-select: none;
    }

    .action-pill svg { width: 14px; height: 14px; flex-shrink: 0; }
    .action-pill:active { transform: scale(.95); }
    .action-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Copy button ─────────────────────────────────────────────────── */
    .copy-btn:hover {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
      box-shadow: 0 2px 10px var(--navy-30);
    }

    .copy-btn.is-copied { background: var(--green-light); border-color: var(--green-border); color: var(--green); }
    .copy-btn.is-copied:hover { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 2px 10px rgba(22,163,74,.3); }

    /* ── Edit & Copy button ──────────────────────────────────────────── */
    .edit-copy-btn:hover {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Tooltip (shared) ────────────────────────────────────────────── */
    .action-tooltip {
      position: absolute;
      bottom: calc(100% + 9px);
      left: 50%;
      transform: translateX(-50%) translateY(5px);
      background: var(--navy);
      color: #fff;
      font-size: .71rem;
      font-weight: 600;
      padding: .3rem .7rem;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 140ms ease, transform 140ms ease;
      z-index: 10;
    }

    .action-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--navy);
    }

    .action-pill:hover .action-tooltip,
    .action-pill:focus-visible .action-tooltip { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Helpful widget ──────────────────────────────────────────────── */
    .faq-helpful {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding-top: 1rem;
      border-top: 1px solid var(--navy-12);
      flex-wrap: wrap;
    }

    .faq-helpful__label { font-size: .8rem; font-weight: 600; color: var(--navy-60); }

    .helpful-btn {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      font-family: var(--font);
      font-size: .78rem;
      font-weight: 600;
      color: var(--navy-60);
      padding: .28rem .75rem;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 100ms ease;
    }

    .helpful-btn:hover { background: var(--navy-06); border-color: var(--navy-30); color: var(--navy); }
    .helpful-btn:active { transform: scale(.94); }
    .helpful-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .helpful-btn.voted-yes { background: var(--green-light); border-color: var(--green-border); color: var(--green); }
    .helpful-btn.voted-no  { background: var(--red-light); border-color: #fca5a5; color: var(--red); }
    .helpful-btn svg { width: 13px; height: 13px; }
    .faq-helpful__thanks { font-size: .8rem; color: var(--navy-60); font-style: italic; }

    /* ── Highlight ───────────────────────────────────────────────────── */
    mark {
      background: var(--highlight);
      color: inherit;
      border-radius: 2px;
      padding: 0 .1em;
    }

    :root[data-theme="dark"] mark { color: #fef9c3; }

    /* ── Empty state ─────────────────────────────────────────────────── */
    .empty-state { text-align: center; padding: 5rem 2rem; }

    .empty-icon {
      width: 64px;
      height: 64px;
      background: var(--navy-06);
      border: 1.5px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      color: var(--navy-60);
    }

    .empty-icon svg { width: 28px; height: 28px; }
    .empty-state__title { font-size: 1.15rem; font-weight: 800; color: var(--navy); margin-bottom: .5rem; }
    .empty-state__sub { font-size: .9rem; color: var(--navy-60); margin-bottom: 1.5rem; }
    .empty-state__suggestions { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; }

    .suggestion-chip {
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: .35rem .9rem;
      font-size: .82rem;
      font-weight: 600;
      color: var(--navy-60);
      background: transparent;
      cursor: pointer;
      font-family: var(--font);
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
    }

    .suggestion-chip:hover { background: var(--navy-06); border-color: var(--navy-30); color: var(--navy); }

    /* ── CTA section ─────────────────────────────────────────────────── */
    .cta-section {
      margin-top: 3.5rem;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
      background: linear-gradient(135deg, var(--navy-06) 0%, transparent 100%);
      position: relative;
      overflow: hidden;
    }

    .cta-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, var(--navy-12) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: .5;
      pointer-events: none;
    }

    .cta-section__inner { position: relative; z-index: 1; }

    .cta-section__icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--navy);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }

    .cta-section__icon svg { width: 24px; height: 24px; }
    .cta-section__title { font-size: 1.3rem; font-weight: 800; color: var(--navy); margin-bottom: .4rem; }

    .cta-section__sub {
      font-size: .9rem;
      color: var(--navy-60);
      margin-bottom: 1.5rem;
      max-width: 380px;
      margin-left: auto;
      margin-right: auto;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: var(--navy);
      color: var(--bg);
      border: none;
      border-radius: 999px;
      font-family: var(--font);
      font-size: .9rem;
      font-weight: 700;
      padding: .75rem 1.75rem;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--navy-30);
      transition: background 180ms ease, box-shadow 180ms ease, transform 120ms ease;
    }

    .cta-btn:hover { background: var(--accent); box-shadow: 0 6px 24px rgba(43,77,179,.4); transform: translateY(-2px); }
    .cta-btn:active { transform: translateY(0) scale(.97); }
    .cta-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .cta-btn svg { width: 16px; height: 16px; }

    /* ── Back to top ─────────────────────────────────────────────────── */
    .back-top {
      position: fixed;
      bottom: 2rem;
      right: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--navy);
      color: var(--bg);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px var(--navy-30);
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity 250ms ease, transform 250ms var(--ease-out), background 300ms ease;
      z-index: 100;
    }

    .back-top.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .back-top:hover { background: var(--accent); box-shadow: 0 6px 20px rgba(43,77,179,.4); }
    .back-top:active { transform: scale(.93); }
    .back-top:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .back-top svg { width: 18px; height: 18px; }

    /* ── Toast ───────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--navy);
      color: var(--bg);
      font-size: .85rem;
      font-weight: 600;
      padding: .65rem 1.25rem;
      border-radius: 999px;
      box-shadow: 0 4px 16px var(--navy-30);
      opacity: 0;
      pointer-events: none;
      transition: opacity 250ms ease, transform 250ms var(--ease-out);
      z-index: 500;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Modal overlay ───────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 40, 0.52);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .modal-overlay.is-open { opacity: 1; pointer-events: auto; }

    /* ── Modal card ──────────────────────────────────────────────────── */
    .modal-card {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 600px;
      max-height: 88vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 32px 96px rgba(10,15,40,.28), 0 8px 24px rgba(10,15,40,.14);
      transform: scale(0.95) translateY(10px);
      transition: transform 260ms var(--ease-out);
    }

    :root[data-theme="dark"] .modal-card { background: var(--surface); }

    .modal-overlay.is-open .modal-card { transform: scale(1) translateY(0); }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.4rem 1.5rem 1.2rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-header-left { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }

    .modal-title { font-size: 1.05rem; font-weight: 800; color: var(--navy); letter-spacing: -.01em; }

    .modal-cat-badge {
      display: inline-block;
      background: var(--navy-12);
      color: var(--navy-60);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: .2rem .65rem;
      border-radius: 999px;
    }

    .modal-close {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border: 1.5px solid var(--border);
      border-radius: 50%;
      background: transparent;
      color: var(--navy-60);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 150ms ease, color 150ms ease, border-color 150ms ease, transform 100ms ease;
    }

    .modal-close:hover { background: var(--navy); color: var(--bg); border-color: var(--navy); }
    .modal-close:active { transform: scale(.9); }
    .modal-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .modal-close svg { width: 14px; height: 14px; }

    .modal-body {
      padding: 1.4rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      overflow-y: auto;
      flex: 1;
    }

    .modal-body::-webkit-scrollbar { width: 4px; }
    .modal-body::-webkit-scrollbar-thumb { background: var(--navy-30); border-radius: 999px; }

    .modal-field-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: .5rem;
      gap: .5rem;
    }

    .modal-label {
      font-size: .73rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--navy-60);
    }

    .modal-word-count {
      font-size: .73rem;
      color: var(--navy-30);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .modal-edited-badge {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-size: .7rem;
      font-weight: 600;
      color: var(--accent);
      opacity: 0;
      transition: opacity 200ms ease;
    }

    .modal-edited-badge.visible { opacity: 1; }
    .modal-edited-badge svg { width: 11px; height: 11px; }

    .modal-textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: .85rem 1rem;
      font-family: var(--font);
      font-size: .95rem;
      color: var(--navy);
      background: rgba(255,255,255,.65);
      line-height: 1.65;
      resize: none;
      overflow: hidden;
      outline: none;
      transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
      display: block;
    }

    :root[data-theme="dark"] .modal-textarea { background: rgba(255,255,255,.04); }
    :root[data-theme="dark"] .modal-textarea:focus { background: rgba(255,255,255,.07); }

    .modal-textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
      background: rgba(255,255,255,.92);
    }

    .modal-textarea::placeholder { color: var(--navy-30); }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.2rem 1.5rem;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--navy-06);
      flex-wrap: wrap;
    }

    .modal-reset-btn {
      background: transparent;
      border: none;
      font-family: var(--font);
      font-size: .82rem;
      font-weight: 600;
      color: var(--navy-30);
      cursor: pointer;
      padding: .4rem .6rem;
      border-radius: 6px;
      transition: color 150ms ease, background 150ms ease;
      display: inline-flex;
      align-items: center;
      gap: .35rem;
    }

    .modal-reset-btn svg { width: 13px; height: 13px; }
    .modal-reset-btn:hover { color: var(--navy-60); background: var(--navy-12); }
    .modal-reset-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .modal-footer-actions { display: flex; align-items: center; gap: .6rem; }

    .modal-copy-answer-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.7);
      font-family: var(--font);
      font-size: .84rem;
      font-weight: 600;
      color: var(--navy-60);
      padding: .52rem 1.1rem;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    :root[data-theme="dark"] .modal-copy-answer-btn { background: rgba(255,255,255,.06); }

    .modal-copy-answer-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .modal-copy-answer-btn:hover { background: rgba(255,255,255,.95); border-color: var(--navy-30); color: var(--navy); }
    .modal-copy-answer-btn.is-copied { background: var(--green-light); border-color: var(--green-border); color: var(--green); }
    .modal-copy-answer-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .modal-copy-qa-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      border: none;
      border-radius: 999px;
      background: var(--navy);
      font-family: var(--font);
      font-size: .84rem;
      font-weight: 700;
      color: var(--bg);
      padding: .54rem 1.3rem;
      cursor: pointer;
      box-shadow: 0 2px 12px var(--navy-30);
      transition: background 160ms ease, box-shadow 160ms ease, transform 100ms ease;
    }

    .modal-copy-qa-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .modal-copy-qa-btn:hover { background: var(--accent); box-shadow: 0 4px 18px rgba(43,77,179,.4); }
    .modal-copy-qa-btn:active { transform: scale(.96); }
    .modal-copy-qa-btn.is-copied { background: var(--green); box-shadow: 0 2px 12px rgba(22,163,74,.35); }
    .modal-copy-qa-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Scrollbar ───────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--navy-30); border-radius: 999px; }

    /* ── Reduced motion ──────────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
      .faq-body { grid-template-rows: 0fr; }
      .faq-item.is-open .faq-body { grid-template-rows: 1fr; }
      .modal-overlay { opacity: 0; }
      .modal-overlay.is-open { opacity: 1; }
    }

    /* ── Responsive ──────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .hero { padding: 2rem 1rem 2.5rem; }
      .hero__title { font-size: clamp(1.9rem, 9vw, 2.75rem); }
      .content { padding: 0 1rem 5rem; }
      .search-hint { display: none; }
      .search-clear { right: 1rem; }
      .search-input { padding-right: 2.8rem; }
      .cta-section { padding: 2rem 1.25rem; }
      .back-top { bottom: 1.5rem; right: 1rem; }
      .modal-overlay { padding: 0; align-items: flex-end; }
      .modal-card { border-radius: 20px 20px 0 0; max-height: 82vh; border-bottom: none; }
      .modal-footer { flex-direction: column-reverse; align-items: stretch; }
      .modal-footer-actions { justify-content: stretch; }
      .modal-copy-answer-btn, .modal-copy-qa-btn { flex: 1; justify-content: center; }
      .faq-actions { gap: .4rem; }
      .action-pill { font-size: .75rem; padding: .38rem .8rem; }
      .faq-toolbar { flex-wrap: wrap; gap: .5rem; }
    }
  </style>
</head>
<body>

<!-- ── Hero ───────────────────────────────────────────────────────────── -->
<header class="hero" role="banner">
  <div class="hero__inner">

    <!-- Dark mode toggle (top-right of hero inner) -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
      <!-- Icon injected by JS -->
    </button>

    <div class="hero__badge" aria-label="FAQ section">
      <span class="hero__badge-dot" aria-hidden="true"></span>
      FAQs
    </div>
    <h1 class="hero__title">What can we<br>help you with?</h1>
    <p class="hero__sub">Everything you need to know. Can't find an answer? Chat with our team.</p>

    <div class="search-wrap" role="search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        id="searchInput"
        type="search"
        class="search-input"
        placeholder="Search questions..."
        aria-label="Search FAQ questions"
        aria-controls="faqList"
        aria-describedby="resultsMeta"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="searchClear" class="search-clear" aria-label="Clear search" tabindex="-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div class="search-hint" aria-hidden="true">
        <span class="kbd">/</span>
      </div>
    </div>
  </div>
</header>

<!-- ── Main content ───────────────────────────────────────────────────── -->
<main>
  <div class="content">

    <nav class="categories" id="categories" aria-label="FAQ categories"></nav>

    <!-- Toolbar: results meta + expand/collapse all -->
    <div class="faq-toolbar">
      <p class="results-meta" id="resultsMeta" aria-live="polite" aria-atomic="true"></p>
      <button class="expand-all-btn" id="expandAllBtn" aria-label="Expand all FAQ items">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
        <span id="expandAllLabel">Expand all</span>
      </button>
    </div>

    <section id="faqList" class="faq-list" aria-label="FAQ list"></section>

    <div class="cta-section">
      <div class="cta-section__inner">
        <div class="cta-section__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <h2 class="cta-section__title">Still have questions?</h2>
        <p class="cta-section__sub">Can't find what you're looking for? Our friendly team is here to help.</p>
        <button class="cta-btn" onclick="showToast('Opening support chat…')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          Chat with us
        </button>
      </div>
    </div>

  </div>
</main>

<button class="back-top" id="backTop" aria-label="Scroll back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <polyline points="18 15 12 9 6 15"/>
  </svg>
</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ── Edit & Copy Modal ───────────────────────────────────────────────── -->
<div class="modal-overlay" id="editModal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <div class="modal-header-left">
        <h2 class="modal-title" id="modalTitle">Edit before copying</h2>
        <span class="modal-cat-badge" id="modalCatBadge"></span>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Close dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal-body" id="modalBody">
      <div class="modal-field">
        <div class="modal-field-header">
          <label class="modal-label" for="modalQuestion">Question</label>
          <span class="modal-edited-badge" id="questionEditedBadge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            Edited
          </span>
        </div>
        <textarea id="modalQuestion" class="modal-textarea" rows="2"
                  spellcheck="true" aria-label="Edit question text" placeholder="Question…"></textarea>
      </div>

      <div class="modal-field">
        <div class="modal-field-header">
          <label class="modal-label" for="modalAnswer">Answer</label>
          <div style="display:flex;align-items:center;gap:.6rem;">
            <span class="modal-edited-badge" id="answerEditedBadge">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              Edited
            </span>
            <span class="modal-word-count" id="modalWordCount" aria-live="polite"></span>
          </div>
        </div>
        <textarea id="modalAnswer" class="modal-textarea" rows="5"
                  spellcheck="true" aria-label="Edit answer text" placeholder="Answer…"></textarea>
      </div>
    </div>

    <div class="modal-footer">
      <button class="modal-reset-btn" id="modalReset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        Reset to original
      </button>
      <div class="modal-footer-actions">
        <button class="modal-copy-answer-btn" id="modalCopyAnswer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span>Copy answer</span>
        </button>
        <button class="modal-copy-qa-btn" id="modalCopyQA">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span>Copy Q&amp;A</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
/* ─── Data ──────────────────────────────────────────────────────────── */
var FAQ_DATA = [
  { id:1,  category:"Pricing", question:"Is there a free trial available?",
    answer:"Yes, you can try us for free for 30 days. If you want, we'll provide you with a free 30-minute onboarding call to get you up and running as quickly as possible." },
  { id:2,  category:"Plans",   question:"Can I change my plan later?",
    answer:"Of course! Our pricing scales with your company. Chat to our friendly team to find a solution that works for you as you grow. You can upgrade or downgrade at any time from your account settings." },
  { id:3,  category:"Billing", question:"What is your cancellation policy?",
    answer:"We understand that things change. You can cancel your plan at any time and we'll refund you the difference already paid. No questions asked — we want you to be happy with your choice." },
  { id:4,  category:"Billing", question:"Can other info be added to an invoice?",
    answer:"At the moment, the only way to add additional information to invoices is to add the information to the workspace's name manually. We're working on a full invoice customisation feature — stay tuned!" },
  { id:5,  category:"Pricing", question:"What does \"lifetime access\" mean?",
    answer:"Once you have purchased the UI kit, you will have access to all of the future updates, free of charge. We'll let you know about releases via email and in-app notifications. There is no annual renewal fee." },
  { id:6,  category:"Pricing", question:"Is it a one-time payment?",
    answer:"Just a one-time payment! No recurring charges or surprises, we promise. We're just as sick of recurring charges as you are. Pay once, use forever." },
  { id:7,  category:"Account", question:"How do I reset my password?",
    answer:"You can reset your password from the login screen by clicking \"Forgot password\". We'll send a reset link to your registered email address. The link expires after 24 hours for security. If you don't receive the email, check your spam folder." },
  { id:8,  category:"Account", question:"Can I have multiple users on one account?",
    answer:"Yes! Our Team and Enterprise plans support multiple seats. Each user gets their own login credentials and personalised settings. Admins can manage permissions, add or remove members, and view usage across all seats from the dashboard." },
  { id:9,  category:"Plans",   question:"What is included in the Enterprise plan?",
    answer:"The Enterprise plan includes everything in Team, plus: SSO/SAML authentication, dedicated account manager, custom SLAs, audit logs, advanced role-based access control, and priority 24/7 support. Contact us for custom pricing." },
  { id:10, category:"Plans",   question:"Do you offer discounts for non-profits or education?",
    answer:"Absolutely. We offer a 50% discount for verified non-profit organisations and educational institutions. Simply contact our support team with proof of your status and we'll apply the discount to your account within one business day." },
  { id:11, category:"Account", question:"How do I delete my account?",
    answer:"You can request account deletion from Settings → Account → Delete Account. Your data will be permanently removed within 30 days in accordance with our data retention policy. This action is irreversible, so please export any data you need beforehand." },
  { id:12, category:"Billing", question:"Which payment methods do you accept?",
    answer:"We accept all major credit and debit cards (Visa, Mastercard, Amex, Discover), PayPal, and bank transfers for annual Enterprise contracts. All payments are processed securely via Stripe. We do not store card details on our servers." }
];

var ALL_CATEGORIES = ["All"];
var catSet = {};
FAQ_DATA.forEach(function(item) {
  if (!catSet[item.category]) { catSet[item.category] = true; ALL_CATEGORIES.push(item.category); }
});
function getCatCount(cat) {
  return cat === "All" ? FAQ_DATA.length : FAQ_DATA.filter(function(i){ return i.category===cat; }).length;
}

/* ─── State ─────────────────────────────────────────────────────────── */
var state = { query:"", activeCategory:"All", openIds:{}, votes:{} };

/* ─── DOM refs ──────────────────────────────────────────────────────── */
var searchInput     = document.getElementById("searchInput");
var searchClear     = document.getElementById("searchClear");
var categoriesEl    = document.getElementById("categories");
var resultsMeta     = document.getElementById("resultsMeta");
var faqList         = document.getElementById("faqList");
var backTop         = document.getElementById("backTop");
var toastEl         = document.getElementById("toast");
var expandAllBtn    = document.getElementById("expandAllBtn");
var expandAllLabel  = document.getElementById("expandAllLabel");
var themeToggle     = document.getElementById("themeToggle");
var modalOverlay    = document.getElementById("editModal");
var modalClose      = document.getElementById("modalClose");
var modalCatBadge   = document.getElementById("modalCatBadge");
var modalQuestion   = document.getElementById("modalQuestion");
var modalAnswer     = document.getElementById("modalAnswer");
var modalWordCount  = document.getElementById("modalWordCount");
var modalReset      = document.getElementById("modalReset");
var modalCopyAnswer = document.getElementById("modalCopyAnswer");
var modalCopyQA     = document.getElementById("modalCopyQA");
var qEditBadge      = document.getElementById("questionEditedBadge");
var aEditBadge      = document.getElementById("answerEditedBadge");

/* ─── Utilities ─────────────────────────────────────────────────────── */
function debounce(fn, delay) {
  var t;
  return function() { var a=arguments; clearTimeout(t); t=setTimeout(function(){ fn.apply(null,a); },delay); };
}

function escapeHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function highlightText(text, query) {
  if (!query) return escapeHtml(text);
  var safe = query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return text.split(new RegExp("("+safe+")","gi")).map(function(p,i){
    return i%2===1 ? "<mark>"+escapeHtml(p)+"</mark>" : escapeHtml(p);
  }).join("");
}

var toastTimer;
function showToast(msg, dur) {
  dur = dur || 2200;
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, dur);
}

function writeClipboard(text, cb) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(cb).catch(function(){ fallbackCopy(text,cb); });
  } else { fallbackCopy(text,cb); }
}

function fallbackCopy(text, cb) {
  var ta=document.createElement("textarea");
  ta.value=text; ta.style.cssText="position:fixed;top:0;left:0;opacity:0;pointer-events:none";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta); cb();
}

var CLIPBOARD_SVG =
  '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>' +
  '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>';
var CHECK_SVG =
  '<polyline points="20 6 9 17 4 12" stroke="currentColor"' +
  ' stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';

function morphCopyBtn(btn, iconEl, labelEl, successLabel, origLabel, origIconHtml) {
  btn.classList.add("is-copied");
  if (labelEl) labelEl.textContent = successLabel;
  if (iconEl)  iconEl.innerHTML = CHECK_SVG;
  clearTimeout(btn._rv);
  btn._rv = setTimeout(function(){
    btn.classList.remove("is-copied");
    if (labelEl) labelEl.textContent = origLabel;
    if (iconEl)  iconEl.innerHTML = origIconHtml;
  }, 1800);
}

/* ─── Dark mode ──────────────────────────────────────────────────────── */
var SUN_SVG  = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
var MOON_SVG = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

function buildThemeSVG(icon) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"' +
    ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    icon + '</svg>';
}

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  themeToggle.innerHTML = theme === "dark" ? buildThemeSVG(SUN_SVG) : buildThemeSVG(MOON_SVG);
  themeToggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
}

(function initTheme() {
  var saved = localStorage.getItem("faq-theme");
  var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(saved || (prefersDark ? "dark" : "light"));
})();

themeToggle.addEventListener("click", function() {
  var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  localStorage.setItem("faq-theme", next);
});

/* ─── Filter ─────────────────────────────────────────────────────────── */
function getFilteredData() {
  var q = state.query.toLowerCase(), cat = state.activeCategory;
  return FAQ_DATA.filter(function(item) {
    if (cat !== "All" && item.category !== cat) return false;
    if (!q) return true;
    return item.question.toLowerCase().indexOf(q)!==-1 || item.answer.toLowerCase().indexOf(q)!==-1;
  });
}

/* ─── Category tabs ──────────────────────────────────────────────────── */
function renderCategories() {
  categoriesEl.innerHTML = "";
  ALL_CATEGORIES.forEach(function(cat) {
    var btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === state.activeCategory ? " active" : "");
    btn.setAttribute("aria-pressed", String(cat === state.activeCategory));
    btn.innerHTML = escapeHtml(cat) + '<span class="cat-count">'+getCatCount(cat)+'</span>';
    btn.addEventListener("click", function(){
      state.activeCategory = cat; renderCategories(); renderFAQs();
    });
    categoriesEl.appendChild(btn);
  });
}

/* ─── Expand / Collapse all ──────────────────────────────────────────── */
function areAllOpen() {
  var items = getFilteredData();
  return items.length > 0 && items.every(function(i){ return !!state.openIds[i.id]; });
}

function setAllOpen(open) {
  getFilteredData().forEach(function(item) {
    state.openIds[item.id] = open;
    var el  = document.getElementById("faq-item-"    + item.id);
    var bod = document.getElementById("faq-body-"    + item.id);
    var trg = document.getElementById("faq-trigger-" + item.id);
    if (!el) return;
    el.classList.toggle("is-open", open);
    if (trg) trg.setAttribute("aria-expanded", String(open));
    if (bod) bod.setAttribute("aria-hidden",   String(!open));
  });
  updateExpandAllBtn();
}

function updateExpandAllBtn() {
  var allOpen = areAllOpen();
  var items   = getFilteredData();
  if (!items.length) { expandAllBtn.style.display = "none"; return; }
  expandAllBtn.style.display = "";
  expandAllLabel.textContent = allOpen ? "Collapse all" : "Expand all";
  expandAllBtn.setAttribute("aria-label", allOpen ? "Collapse all FAQ items" : "Expand all FAQ items");
  /* Rotate chevron when all open */
  var chevron = expandAllBtn.querySelector("svg");
  if (chevron) chevron.style.transform = allOpen ? "rotate(180deg)" : "rotate(0deg)";
}

expandAllBtn.addEventListener("click", function() { setAllOpen(!areAllOpen()); });

/* ─── Accordion toggle ───────────────────────────────────────────────── */
function toggleItem(id) {
  state.openIds[id] = !state.openIds[id];
  var el  = document.getElementById("faq-item-"    + id);
  var bod = document.getElementById("faq-body-"    + id);
  var trg = document.getElementById("faq-trigger-" + id);
  if (!el) return;
  var open = state.openIds[id];
  el.classList.toggle("is-open", open);
  if (trg) trg.setAttribute("aria-expanded", String(open));
  if (bod) bod.setAttribute("aria-hidden",   String(!open));
  updateExpandAllBtn();
}

/* ─── FAQ render ─────────────────────────────────────────────────────── */
function renderFAQs() {
  var items = getFilteredData();
  faqList.innerHTML = "";

  if (state.query) {
    resultsMeta.textContent = items.length
      ? items.length + " result" + (items.length!==1?"s":"") + " for “" + state.query + "”"
      : "";
  } else {
    resultsMeta.textContent = items.length + " question" + (items.length!==1?"s":"");
  }

  if (items.length === 0) {
    expandAllBtn.style.display = "none";
    faqList.innerHTML =
      '<div class="empty-state" role="status">' +
        '<div class="empty-icon" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
            '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/>' +
          '</svg></div>' +
        '<p class="empty-state__title">No results found</p>' +
        '<p class="empty-state__sub">Try a different keyword, or browse a category.</p>' +
        '<div class="empty-state__suggestions">' +
          '<button class="suggestion-chip" data-suggest="free trial">free trial</button>' +
          '<button class="suggestion-chip" data-suggest="pricing">pricing</button>' +
          '<button class="suggestion-chip" data-suggest="cancel">cancel</button>' +
          '<button class="suggestion-chip" data-suggest="invoice">invoice</button>' +
        '</div></div>';
    faqList.querySelectorAll(".suggestion-chip").forEach(function(chip) {
      chip.addEventListener("click", function(){
        var t=chip.getAttribute("data-suggest");
        searchInput.value=t; state.query=t; updateClearBtn(); renderFAQs();
      });
    });
    return;
  }

  items.forEach(function(item, index) {
    var isOpen = !!state.openIds[item.id];
    var vote   = state.votes[item.id];

    var el = document.createElement("div");
    el.className  = "faq-item faq-item--entering" + (isOpen ? " is-open" : "");
    el.id         = "faq-item-" + item.id;
    el.setAttribute("data-id", String(item.id));
    el.style.transitionDelay = (index * 45) + "ms";

    var helpfulHtml = vote
      ? '<span class="faq-helpful__thanks">Thanks for your feedback!</span>'
      : '<span class="faq-helpful__label">Was this helpful?</span>' +
        '<button class="helpful-btn" data-vote="yes" data-faq-id="'+item.id+'" aria-label="Yes, helpful">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/>' +
            '<path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>Yes</button>' +
        '<button class="helpful-btn" data-vote="no" data-faq-id="'+item.id+'" aria-label="No, not helpful">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/>' +
            '<path d="M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg>No</button>';

    el.innerHTML =
      '<button class="faq-trigger" id="faq-trigger-'+item.id+'"' +
          ' aria-expanded="'+isOpen+'" aria-controls="faq-body-'+item.id+'">' +
        '<span class="faq-question">'+highlightText(item.question, state.query)+'</span>' +
        '<span class="faq-icon" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
            '<line x1="12" y1="5" x2="12" y2="19" class="faq-icon-v"/>' +
            '<line x1="5" y1="12" x2="19" y2="12"/>' +
          '</svg></span>' +
      '</button>' +
      '<div class="faq-body" id="faq-body-'+item.id+'"' +
           ' role="region" aria-labelledby="faq-trigger-'+item.id+'" aria-hidden="'+!isOpen+'">' +
        '<div class="faq-body-inner"><div class="faq-answer-wrap">' +
          '<p class="faq-answer">'+highlightText(item.answer, state.query)+'</p>' +

          /* ── 3-button action row ── */
          '<div class="faq-actions">' +

            /* Copy Q&A */
            '<button class="action-pill copy-btn" data-faq-id="'+item.id+'" aria-label="Copy Q&amp;A">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+CLIPBOARD_SVG+'</svg>' +
              '<span>Copy</span>' +
              '<span class="action-tooltip" aria-hidden="true">Copy Q&amp;A to clipboard</span>' +
            '</button>' +

            /* Edit & Copy */
            '<button class="action-pill edit-copy-btn" data-faq-id="'+item.id+'" aria-label="Edit then copy">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>' +
                '<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>' +
              '</svg>' +
              '<span>Edit &amp; Copy</span>' +
              '<span class="action-tooltip" aria-hidden="true">Edit before copying</span>' +
            '</button>' +

          '</div>' +

          '<div class="faq-helpful">'+helpfulHtml+'</div>' +
        '</div></div></div>';

    /* Accordion toggle */
    (function(faqId){
      el.querySelector(".faq-trigger").addEventListener("click", function(){ toggleItem(faqId); });
    })(item.id);

    /* Copy Q&A */
    (function(faqItem){
      var btn = el.querySelector(".copy-btn");
      var ico = btn.querySelector("svg");
      var lbl = btn.querySelector("span");
      var tip = btn.querySelector(".action-tooltip");
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        writeClipboard("Q: "+faqItem.question+"\n\nA: "+faqItem.answer, function(){
          morphCopyBtn(btn, ico, lbl, "Copied!", "Copy", CLIPBOARD_SVG);
          if (tip) { tip.textContent="Copied!"; setTimeout(function(){ tip.textContent="Copy Q&A to clipboard"; },1800); }
        });
      });
    })(item);

    /* Edit & Copy → modal */
    (function(faqItem){
      var editBtn = el.querySelector(".edit-copy-btn");
      editBtn.addEventListener("click", function(e){ e.stopPropagation(); openModal(faqItem, editBtn); });
    })(item);


    /* Helpful votes */
    el.querySelectorAll(".helpful-btn").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var faqId=parseInt(btn.getAttribute("data-faq-id"),10);
        var v=btn.getAttribute("data-vote");
        state.votes[faqId]=v;
        showToast(v==="yes" ? "Thanks! Glad that helped." : "Thanks for the feedback — we'll improve this.");
        var hd=el.querySelector(".faq-helpful");
        if(hd) hd.innerHTML='<span class="faq-helpful__thanks">Thanks for your feedback!</span>';
      });
    });

    faqList.appendChild(el);

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.classList.remove("faq-item--entering");
        el.addEventListener("transitionend", function clr(evt){
          if(evt.propertyName==="opacity"){ el.style.transitionDelay=""; el.removeEventListener("transitionend",clr); }
        });
      });
    });
  });

  updateExpandAllBtn();
}

/* ─── Search ─────────────────────────────────────────────────────────── */
function updateClearBtn() {
  searchClear.classList.toggle("visible", state.query.length>0);
  searchClear.tabIndex = state.query.length>0 ? 0 : -1;
}

searchInput.addEventListener("input", debounce(function(){
  state.query = searchInput.value.trim(); updateClearBtn(); renderFAQs();
}, 200));

searchClear.addEventListener("click", function(){
  searchInput.value=""; state.query=""; updateClearBtn(); renderFAQs(); searchInput.focus();
});

/* ─── Keyboard shortcuts ─────────────────────────────────────────────── */
document.addEventListener("keydown", function(e){
  var active = document.activeElement;
  var tag    = active ? active.tagName.toLowerCase() : "";
  var inInput= tag==="input" || tag==="textarea" || (active && active.isContentEditable);
  var modalOpen = modalOverlay.classList.contains("is-open");

  if (e.key==="/" && !inInput && !modalOpen) { e.preventDefault(); searchInput.focus(); searchInput.select(); return; }
  if (e.key==="Escape" && inInput && !modalOpen) { searchInput.value=""; state.query=""; updateClearBtn(); renderFAQs(); searchInput.blur(); return; }
  if ((e.key==="ArrowDown"||e.key==="ArrowUp") && !inInput && !modalOpen) {
    var trgs = Array.from(faqList.querySelectorAll(".faq-trigger"));
    if (!trgs.length) return;
    var idx = trgs.indexOf(document.activeElement);
    idx = e.key==="ArrowDown" ? (idx<trgs.length-1?idx+1:0) : (idx>0?idx-1:trgs.length-1);
    e.preventDefault(); trgs[idx].focus();
  }
});

/* ─── Back to top ────────────────────────────────────────────────────── */
window.addEventListener("scroll", debounce(function(){ backTop.classList.toggle("visible", window.scrollY>400); }, 80), {passive:true});
backTop.addEventListener("click", function(){ window.scrollTo({top:0, behavior:"smooth"}); });

/* ═══════════════════════════════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════════════════════════════ */
var modalOriginal = { question:"", answer:"" };
var modalTriggerEl = null;

function autoResize(ta) { ta.style.height="auto"; ta.style.height=(ta.scrollHeight+2)+"px"; }

function updateWordCount() {
  var t=modalAnswer.value.trim();
  var w=t?t.split(/\s+/).length:0;
  modalWordCount.textContent = w+" word"+(w!==1?"s":"")+" · "+modalAnswer.value.length+" ch";
}

function updateEditBadges() {
  qEditBadge.classList.toggle("visible", modalQuestion.value!==modalOriginal.question);
  aEditBadge.classList.toggle("visible", modalAnswer.value!==modalOriginal.answer);
}

function openModal(item, triggerEl) {
  modalOriginal.question = item.question;
  modalOriginal.answer   = item.answer;
  modalTriggerEl = triggerEl || null;

  modalCatBadge.textContent = item.category;
  modalQuestion.value = item.question;
  modalAnswer.value   = item.answer;

  qEditBadge.classList.remove("visible");
  aEditBadge.classList.remove("visible");
  modalCopyAnswer.classList.remove("is-copied");
  modalCopyQA.classList.remove("is-copied");
  modalCopyAnswer.querySelector("span").textContent = "Copy answer";
  modalCopyQA.querySelector("span").textContent     = "Copy Q&A";
  modalCopyAnswer.querySelector("svg").innerHTML = CLIPBOARD_SVG;
  modalCopyQA.querySelector("svg").innerHTML     = '<polyline points="20 6 9 17 4 12"/>';

  modalOverlay.classList.add("is-open");
  modalOverlay.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";

  requestAnimationFrame(function(){
    autoResize(modalQuestion); autoResize(modalAnswer); updateWordCount();
    setTimeout(function(){ modalQuestion.focus(); modalQuestion.setSelectionRange(0,0); }, 230);
  });
}

function closeModal() {
  modalOverlay.classList.remove("is-open");
  modalOverlay.setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
  if (modalTriggerEl) setTimeout(function(){ if(modalTriggerEl) modalTriggerEl.focus(); }, 240);
}

function getModalFocusable() {
  return Array.from(modalOverlay.querySelectorAll(
    'button:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
  )).filter(function(el){ return el.offsetParent!==null; });
}

modalOverlay.addEventListener("keydown", function(e){
  if (e.key==="Escape") { closeModal(); return; }
  if (e.key!=="Tab") return;
  var f=getModalFocusable();
  if (!f.length) return;
  if (e.shiftKey) { if(document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus();} }
  else            { if(document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus();} }
});

modalOverlay.addEventListener("click", function(e){ if(e.target===modalOverlay) closeModal(); });
modalClose.addEventListener("click", closeModal);

modalQuestion.addEventListener("input", function(){ autoResize(modalQuestion); updateEditBadges(); });
modalAnswer.addEventListener("input",   function(){ autoResize(modalAnswer); updateWordCount(); updateEditBadges(); });

modalReset.addEventListener("click", function(){
  modalQuestion.value=modalOriginal.question; modalAnswer.value=modalOriginal.answer;
  autoResize(modalQuestion); autoResize(modalAnswer); updateWordCount(); updateEditBadges(); modalQuestion.focus();
});

modalCopyAnswer.addEventListener("click", function(){
  writeClipboard(modalAnswer.value, function(){
    morphCopyBtn(modalCopyAnswer, modalCopyAnswer.querySelector("svg"), modalCopyAnswer.querySelector("span"), "Copied!", "Copy answer", CLIPBOARD_SVG);
    showToast("Answer copied to clipboard");
  });
});

modalCopyQA.addEventListener("click", function(){
  var text="Q: "+modalQuestion.value.trim()+"\n\nA: "+modalAnswer.value.trim();
  writeClipboard(text, function(){
    morphCopyBtn(modalCopyQA, modalCopyQA.querySelector("svg"), modalCopyQA.querySelector("span"), "Copied!", "Copy Q&A", '<polyline points="20 6 9 17 4 12"/>');
    showToast("Q⁠&⁠A copied to clipboard");
  });
});

/* ─── Boot ───────────────────────────────────────────────────────────── */
renderCategories();
renderFAQs();

/* Default: open first item */
if (FAQ_DATA.length > 0) {
  var fid = FAQ_DATA[0].id;
  state.openIds[fid] = true;
  var fe=document.getElementById("faq-item-"+fid), ft=document.getElementById("faq-trigger-"+fid), fb=document.getElementById("faq-body-"+fid);
  if(fe) fe.classList.add("is-open");
  if(ft) ft.setAttribute("aria-expanded","true");
  if(fb) fb.setAttribute("aria-hidden","false");
  updateExpandAllBtn();
}

</script>
