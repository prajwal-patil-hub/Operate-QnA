<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operate Help Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ───────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Light tokens ────────────────────────────────────────────────── */
    :root {
      --bg:           #F2EDE3;
      --surface:      #FFFFFF;
      --navy:         #1C2D6E;
      --navy-90:      rgba(28,45,110,.90);
      --navy-60:      rgba(28,45,110,.60);
      --navy-30:      rgba(28,45,110,.30);
      --navy-12:      rgba(28,45,110,.12);
      --navy-06:      rgba(28,45,110,.06);
      --border:       rgba(28,45,110,.18);
      --accent:       #2B4DB3;
      --accent-light: rgba(43,77,179,.10);
      --green:        #16a34a;
      --green-light:  #dcfce7;
      --green-border: #86efac;
      --red:          #dc2626;
      --red-light:    #fee2e2;
      --highlight:    #fef08a;
      --font:         'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono:         'JetBrains Mono', 'Courier New', monospace;
      --ease-out:     cubic-bezier(0.22, 1, 0.36, 1);
      --ease-in-out:  cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Dark tokens ─────────────────────────────────────────────────── */
    :root[data-theme="dark"] {
      --bg:           #0D1B3E;
      --surface:      #162248;
      --navy:         #D4DCF5;
      --navy-90:      rgba(212,220,245,.90);
      --navy-60:      rgba(212,220,245,.60);
      --navy-30:      rgba(212,220,245,.30);
      --navy-12:      rgba(212,220,245,.10);
      --navy-06:      rgba(212,220,245,.05);
      --border:       rgba(212,220,245,.14);
      --accent:       #7B9FFF;
      --accent-light: rgba(123,159,255,.15);
      --green:        #4ade80;
      --green-light:  rgba(74,222,128,.12);
      --green-border: rgba(74,222,128,.35);
      --red:          #f87171;
      --red-light:    rgba(248,113,113,.12);
      --highlight:    rgba(254,240,138,.20);
    }

    html { scroll-behavior: smooth; font-size: 16px; }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: var(--font);
      color: var(--navy);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 300ms ease, color 300ms ease;
    }

    /* ── Hero ────────────────────────────────────────────────────────── */
    .hero {
      position: relative;
      overflow: hidden;
      padding: 3rem 1.5rem 3.5rem;
      background:
        radial-gradient(circle, var(--navy-12) 1px, transparent 1px),
        var(--bg);
      background-size: 28px 28px, auto;
      border-bottom: 1px solid var(--border);
      transition: background 300ms ease, border-color 300ms ease;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 0%, transparent 50%, var(--bg) 100%);
      pointer-events: none;
      transition: background 300ms ease;
    }

    .hero__inner {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
    }

    /* ── Theme toggle ────────────────────────────────────────────────── */
    .theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--navy-06);
      color: var(--navy-60);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        background    180ms ease,
        border-color  180ms ease,
        color         180ms ease,
        transform     120ms ease,
        box-shadow    180ms ease;
      z-index: 2;
    }

    .theme-toggle:hover {
      background: var(--navy-12);
      border-color: var(--navy-30);
      color: var(--navy);
      box-shadow: 0 2px 8px var(--navy-12);
    }

    .theme-toggle:active { transform: scale(.9); }
    .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .theme-toggle svg { width: 17px; height: 17px; }

    .hero__badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      border: 1.5px solid var(--navy);
      border-radius: 999px;
      padding: .25rem .85rem;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--navy);
      margin-bottom: 1.25rem;
      background: transparent;
      transition: border-color 300ms ease, color 300ms ease;
    }

    .hero__badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--navy);
      animation: pulse 2s ease-in-out infinite;
      transition: background 300ms ease;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.4); opacity: .6; }
    }

    .hero__title {
      font-size: clamp(2.25rem, 6vw, 3.75rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -.03em;
      color: var(--navy);
      margin-bottom: .75rem;
      transition: color 300ms ease;
    }

    .hero__sub {
      font-size: 1.05rem;
      color: var(--navy-60);
      max-width: 480px;
      margin-bottom: 2rem;
    }

    /* ── Search ──────────────────────────────────────────────────────── */
    .search-wrap { position: relative; max-width: 540px; }

    .search-icon {
      position: absolute;
      left: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--navy-60);
      width: 18px;
      height: 18px;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: .9rem 7rem .9rem 2.9rem;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(8px);
      font-family: var(--font);
      font-size: .975rem;
      color: var(--navy);
      box-shadow: 0 2px 8px var(--navy-12);
      transition:
        border-color 200ms var(--ease-in-out),
        box-shadow   200ms var(--ease-in-out),
        background   300ms ease;
      outline: none;
      appearance: none;
    }

    :root[data-theme="dark"] .search-input {
      background: rgba(22,34,72,.9);
      color: var(--navy);
    }

    .search-input::placeholder { color: var(--navy-30); }
    .search-input::-webkit-search-cancel-button { display: none; }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-light), 0 2px 8px var(--navy-12);
    }

    .search-clear {
      position: absolute;
      right: 4.5rem;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border: none;
      background: var(--navy-12);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--navy-60);
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease, background 150ms ease, color 150ms ease, transform 100ms ease;
    }

    .search-clear.visible { opacity: 1; pointer-events: auto; }
    .search-clear:hover { background: var(--navy-30); color: var(--navy); }
    .search-clear:active { transform: translateY(-50%) scale(.9); }
    .search-clear svg { width: 12px; height: 12px; }

    .search-hint {
      position: absolute;
      right: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .kbd {
      display: inline-block;
      background: rgba(255,255,255,.7);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: .7rem;
      font-family: var(--font);
      color: var(--navy-60);
      padding: .1rem .4rem;
      line-height: 1.5;
      font-weight: 600;
    }

    :root[data-theme="dark"] .kbd { background: rgba(255,255,255,.06); }

    /* ── Content wrapper ─────────────────────────────────────────────── */
    .content { max-width: 720px; margin: 0 auto; padding: 0 1.5rem 6rem; }

    /* ── Category Filter Tabs ────────────────────────────────────────── */
    .categories {
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
      padding: 1.75rem 0 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .cat-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      font-family: var(--font);
      font-size: .82rem;
      font-weight: 600;
      color: var(--navy-60);
      padding: .35rem .9rem;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease, transform 100ms ease, box-shadow 180ms ease;
    }

    .cat-btn:hover { background: var(--navy-06); border-color: var(--navy-30); color: var(--navy); }
    .cat-btn:active { transform: scale(.96); }
    .cat-btn.active { background: var(--navy); border-color: var(--navy); color: #fff; box-shadow: 0 2px 8px var(--navy-30); }
    .cat-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .cat-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 .4rem;
      border-radius: 999px;
      font-size: .68rem;
      font-weight: 700;
      background: var(--navy-12);
      color: var(--navy-60);
      transition: background 180ms ease, color 180ms ease;
    }

    .cat-btn.active .cat-count { background: rgba(255,255,255,.25); color: #fff; }

    /* ── Toolbar (results meta + expand all) ─────────────────────────── */
    .faq-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .9rem 0 .1rem;
      min-height: 2.5rem;
    }

    .results-meta {
      font-size: .82rem;
      font-weight: 500;
      color: var(--navy-60);
    }

    .expand-all-btn {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      font-family: var(--font);
      font-size: .78rem;
      font-weight: 600;
      color: var(--navy-60);
      padding: .3rem .85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 100ms ease;
      flex-shrink: 0;
    }

    .expand-all-btn svg { width: 12px; height: 12px; flex-shrink: 0; }
    .expand-all-btn:hover { background: var(--navy-06); border-color: var(--navy-30); color: var(--navy); }
    .expand-all-btn:active { transform: scale(.95); }
    .expand-all-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Load Excel button ───────────────────────────────────────────── */
    .toolbar-right { display: flex; align-items: center; gap: .5rem; }

    .load-excel-btn {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      font-family: var(--font);
      font-size: .78rem;
      font-weight: 600;
      color: var(--navy-60);
      padding: .3rem .85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 100ms ease;
      flex-shrink: 0;
    }

    .load-excel-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
    .load-excel-btn:hover { background: var(--navy-06); border-color: var(--navy-30); color: var(--navy); }
    .load-excel-btn:active { transform: scale(.95); }
    .load-excel-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .load-excel-btn.loaded { background: var(--green-light); border-color: var(--green-border); color: var(--green); }
    .load-excel-btn.loaded:hover { background: var(--green); border-color: var(--green); color: #fff; }

    /* ── FAQ list & item ─────────────────────────────────────────────── */
    .faq-list { border-top: 1px solid var(--border); }

    .faq-item {
      border-bottom: 1px solid var(--border);
      opacity: 1;
      transform: translateY(0);
      transition: opacity 300ms var(--ease-out), transform 300ms var(--ease-out);
      scroll-margin-top: 1.5rem;
    }

    .faq-item--entering { opacity: 0; transform: translateY(8px); }

    /* ── Trigger ─────────────────────────────────────────────────────── */
    .faq-trigger {
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 1.4rem 0;
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      text-align: left;
      color: var(--navy);
    }

    .faq-trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    .faq-question {
      font-size: 1.0rem;
      font-weight: 700;
      line-height: 1.45;
      color: var(--navy);
      flex: 1;
      transition: color 150ms ease;
    }

    .faq-item:hover .faq-question { color: var(--accent); }

    .faq-icon {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: .1rem;
      background: transparent;
      transition: background 200ms ease, border-color 200ms ease;
      color: var(--navy);
    }

    .faq-item:hover .faq-icon { background: var(--navy-06); border-color: var(--navy-30); }
    .faq-item.is-open .faq-icon { background: var(--navy); border-color: var(--navy); color: #fff; }
    .faq-icon svg { width: 12px; height: 12px; }
    .faq-icon-v { transition: transform 300ms var(--ease-in-out), opacity 300ms ease; }
    .faq-item.is-open .faq-icon-v { transform: rotate(90deg); opacity: 0; }

    /* ── Accordion body ──────────────────────────────────────────────── */
    .faq-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 350ms var(--ease-in-out);
    }

    .faq-item.is-open .faq-body { grid-template-rows: 1fr; }
    .faq-body-inner { overflow: hidden; }
    .faq-answer-wrap { padding-bottom: 1.5rem; }

    .faq-answer {
      font-size: .97rem;
      color: var(--navy-90);
      line-height: 1.75;
      max-width: 600px;
    }

    /* ── Action row ──────────────────────────────────────────────────── */
    .faq-actions {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin: 1.1rem 0 1.25rem;
      flex-wrap: wrap;
    }

    /* Shared pill-button base */
    .action-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      font-family: var(--font);
      font-size: .8rem;
      font-weight: 600;
      color: var(--navy-60);
      padding: .42rem 1rem;
      cursor: pointer;
      transition:
        background    160ms ease,
        border-color  160ms ease,
        color         160ms ease,
        box-shadow    160ms ease,
        transform     100ms ease;
      user-select: none;
    }

    .action-pill svg { width: 14px; height: 14px; flex-shrink: 0; }
    .action-pill:active { transform: scale(.95); }
    .action-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Copy button ─────────────────────────────────────────────────── */
    .copy-btn:hover {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
      box-shadow: 0 2px 10px var(--navy-30);
    }

    .copy-btn.is-copied { background: var(--green-light); border-color: var(--green-border); color: var(--green); }
    .copy-btn.is-copied:hover { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 2px 10px rgba(22,163,74,.3); }

    /* ── Edit & Copy button ──────────────────────────────────────────── */
    .edit-copy-btn:hover {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Tooltip (shared) ────────────────────────────────────────────── */
    .action-tooltip {
      position: absolute;
      bottom: calc(100% + 9px);
      left: 50%;
      transform: translateX(-50%) translateY(5px);
      background: var(--navy);
      color: #fff;
      font-size: .71rem;
      font-weight: 600;
      padding: .3rem .7rem;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 140ms ease, transform 140ms ease;
      z-index: 10;
    }

    .action-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--navy);
    }

    .action-pill:hover .action-tooltip,
    .action-pill:focus-visible .action-tooltip { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Helpful widget ──────────────────────────────────────────────── */
    .faq-helpful {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding-top: 1rem;
      border-top: 1px solid var(--navy-12);
      flex-wrap: wrap;
    }

    .faq-helpful__label { font-size: .8rem; font-weight: 600; color: var(--navy-60); }

    .helpful-btn {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      font-family: var(--font);
      font-size: .78rem;
      font-weight: 600;
      color: var(--navy-60);
      padding: .28rem .75rem;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 100ms ease;
    }

    .helpful-btn:hover { background: var(--navy-06); border-color: var(--navy-30); color: var(--navy); }
    .helpful-btn:active { transform: scale(.94); }
    .helpful-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .helpful-btn.voted-yes { background: var(--green-light); border-color: var(--green-border); color: var(--green); }
    .helpful-btn.voted-no  { background: var(--red-light); border-color: #fca5a5; color: var(--red); }
    .helpful-btn svg { width: 13px; height: 13px; }
    .faq-helpful__thanks { font-size: .8rem; color: var(--navy-60); font-style: italic; }

    /* ── Highlight ───────────────────────────────────────────────────── */
    mark {
      background: var(--highlight);
      color: inherit;
      border-radius: 2px;
      padding: 0 .1em;
    }

    :root[data-theme="dark"] mark { color: #fef9c3; }

    /* ── Empty state ─────────────────────────────────────────────────── */
    .empty-state { text-align: center; padding: 5rem 2rem; }

    .empty-icon {
      width: 64px;
      height: 64px;
      background: var(--navy-06);
      border: 1.5px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      color: var(--navy-60);
    }

    .empty-icon svg { width: 28px; height: 28px; }
    .empty-state__title { font-size: 1.15rem; font-weight: 800; color: var(--navy); margin-bottom: .5rem; }
    .empty-state__sub { font-size: .9rem; color: var(--navy-60); margin-bottom: 1.5rem; }
    .empty-state__suggestions { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; }

    .suggestion-chip {
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: .35rem .9rem;
      font-size: .82rem;
      font-weight: 600;
      color: var(--navy-60);
      background: transparent;
      cursor: pointer;
      font-family: var(--font);
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
    }

    .suggestion-chip:hover { background: var(--navy-06); border-color: var(--navy-30); color: var(--navy); }

    /* ── CTA section ─────────────────────────────────────────────────── */
    .cta-section {
      margin-top: 3.5rem;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
      background: linear-gradient(135deg, var(--navy-06) 0%, transparent 100%);
      position: relative;
      overflow: hidden;
    }

    .cta-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, var(--navy-12) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: .5;
      pointer-events: none;
    }

    .cta-section__inner { position: relative; z-index: 1; }

    .cta-section__icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--navy);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }

    .cta-section__icon svg { width: 24px; height: 24px; }
    .cta-section__title { font-size: 1.3rem; font-weight: 800; color: var(--navy); margin-bottom: .4rem; }

    .cta-section__sub {
      font-size: .9rem;
      color: var(--navy-60);
      margin-bottom: 1.5rem;
      max-width: 380px;
      margin-left: auto;
      margin-right: auto;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: var(--navy);
      color: var(--bg);
      border: none;
      border-radius: 999px;
      font-family: var(--font);
      font-size: .9rem;
      font-weight: 700;
      padding: .75rem 1.75rem;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--navy-30);
      transition: background 180ms ease, box-shadow 180ms ease, transform 120ms ease;
    }

    .cta-btn:hover { background: var(--accent); box-shadow: 0 6px 24px rgba(43,77,179,.4); transform: translateY(-2px); }
    .cta-btn:active { transform: translateY(0) scale(.97); }
    .cta-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .cta-btn svg { width: 16px; height: 16px; }

    /* ── Back to top ─────────────────────────────────────────────────── */
    .back-top {
      position: fixed;
      bottom: 2rem;
      right: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--navy);
      color: var(--bg);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px var(--navy-30);
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity 250ms ease, transform 250ms var(--ease-out), background 300ms ease;
      z-index: 100;
    }

    .back-top.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .back-top:hover { background: var(--accent); box-shadow: 0 6px 20px rgba(43,77,179,.4); }
    .back-top:active { transform: scale(.93); }
    .back-top:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .back-top svg { width: 18px; height: 18px; }

    /* ── Toast ───────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--navy);
      color: var(--bg);
      font-size: .85rem;
      font-weight: 600;
      padding: .65rem 1.25rem;
      border-radius: 999px;
      box-shadow: 0 4px 16px var(--navy-30);
      opacity: 0;
      pointer-events: none;
      transition: opacity 250ms ease, transform 250ms var(--ease-out);
      z-index: 500;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Modal overlay ───────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 40, 0.52);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .modal-overlay.is-open { opacity: 1; pointer-events: auto; }

    /* ── Modal card ──────────────────────────────────────────────────── */
    .modal-card {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 600px;
      max-height: 88vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 32px 96px rgba(10,15,40,.28), 0 8px 24px rgba(10,15,40,.14);
      transform: scale(0.95) translateY(10px);
      transition: transform 260ms var(--ease-out);
    }

    :root[data-theme="dark"] .modal-card { background: var(--surface); }

    .modal-overlay.is-open .modal-card { transform: scale(1) translateY(0); }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.4rem 1.5rem 1.2rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-header-left { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }

    .modal-title { font-size: 1.05rem; font-weight: 800; color: var(--navy); letter-spacing: -.01em; }

    .modal-cat-badge {
      display: inline-block;
      background: var(--navy-12);
      color: var(--navy-60);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: .2rem .65rem;
      border-radius: 999px;
    }

    .modal-close {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border: 1.5px solid var(--border);
      border-radius: 50%;
      background: transparent;
      color: var(--navy-60);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 150ms ease, color 150ms ease, border-color 150ms ease, transform 100ms ease;
    }

    .modal-close:hover { background: var(--navy); color: var(--bg); border-color: var(--navy); }
    .modal-close:active { transform: scale(.9); }
    .modal-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .modal-close svg { width: 14px; height: 14px; }

    .modal-body {
      padding: 1.4rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      overflow-y: auto;
      flex: 1;
    }

    .modal-body::-webkit-scrollbar { width: 4px; }
    .modal-body::-webkit-scrollbar-thumb { background: var(--navy-30); border-radius: 999px; }

    .modal-field-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: .5rem;
      gap: .5rem;
    }

    .modal-label {
      font-size: .73rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--navy-60);
    }

    .modal-word-count {
      font-size: .73rem;
      color: var(--navy-30);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .modal-edited-badge {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-size: .7rem;
      font-weight: 600;
      color: var(--accent);
      opacity: 0;
      transition: opacity 200ms ease;
    }

    .modal-edited-badge.visible { opacity: 1; }
    .modal-edited-badge svg { width: 11px; height: 11px; }

    .modal-textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: .85rem 1rem;
      font-family: var(--font);
      font-size: .95rem;
      color: var(--navy);
      background: rgba(255,255,255,.65);
      line-height: 1.65;
      resize: none;
      overflow: hidden;
      outline: none;
      transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
      display: block;
    }

    :root[data-theme="dark"] .modal-textarea { background: rgba(255,255,255,.04); }
    :root[data-theme="dark"] .modal-textarea:focus { background: rgba(255,255,255,.07); }

    .modal-textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
      background: rgba(255,255,255,.92);
    }

    .modal-textarea::placeholder { color: var(--navy-30); }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.2rem 1.5rem;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--navy-06);
      flex-wrap: wrap;
    }

    .modal-reset-btn {
      background: transparent;
      border: none;
      font-family: var(--font);
      font-size: .82rem;
      font-weight: 600;
      color: var(--navy-30);
      cursor: pointer;
      padding: .4rem .6rem;
      border-radius: 6px;
      transition: color 150ms ease, background 150ms ease;
      display: inline-flex;
      align-items: center;
      gap: .35rem;
    }

    .modal-reset-btn svg { width: 13px; height: 13px; }
    .modal-reset-btn:hover { color: var(--navy-60); background: var(--navy-12); }
    .modal-reset-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .modal-footer-actions { display: flex; align-items: center; gap: .6rem; }

    .modal-copy-answer-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.7);
      font-family: var(--font);
      font-size: .84rem;
      font-weight: 600;
      color: var(--navy-60);
      padding: .52rem 1.1rem;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    :root[data-theme="dark"] .modal-copy-answer-btn { background: rgba(255,255,255,.06); }

    .modal-copy-answer-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .modal-copy-answer-btn:hover { background: rgba(255,255,255,.95); border-color: var(--navy-30); color: var(--navy); }
    .modal-copy-answer-btn.is-copied { background: var(--green-light); border-color: var(--green-border); color: var(--green); }
    .modal-copy-answer-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .modal-copy-qa-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      border: none;
      border-radius: 999px;
      background: var(--navy);
      font-family: var(--font);
      font-size: .84rem;
      font-weight: 700;
      color: var(--bg);
      padding: .54rem 1.3rem;
      cursor: pointer;
      box-shadow: 0 2px 12px var(--navy-30);
      transition: background 160ms ease, box-shadow 160ms ease, transform 100ms ease;
    }

    .modal-copy-qa-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .modal-copy-qa-btn:hover { background: var(--accent); box-shadow: 0 4px 18px rgba(43,77,179,.4); }
    .modal-copy-qa-btn:active { transform: scale(.96); }
    .modal-copy-qa-btn.is-copied { background: var(--green); box-shadow: 0 2px 12px rgba(22,163,74,.35); }
    .modal-copy-qa-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Scrollbar ───────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--navy-30); border-radius: 999px; }

    /* ── Top bar ─────────────────────────────────────────────────────── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .55rem 1.5rem;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 200;
      transition: background 300ms ease, border-color 300ms ease;
    }

    .app-logo { display: flex; align-items: center; gap: .6rem; }

    .app-logo__icon {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--navy); color: var(--bg);
      display: flex; align-items: center; justify-content: center;
    }
    .app-logo__icon svg { width: 15px; height: 15px; }

    .app-logo__name {
      font-size: .88rem; font-weight: 800;
      letter-spacing: -.02em; color: var(--navy);
    }

    .top-bar .theme-toggle { position: static; }
    .top-bar .load-excel-btn { font-size: .78rem; padding: .28rem .75rem; }
    .top-bar .load-excel-btn svg { width: 12px; height: 12px; }

    /* ── Section nav pill toggle ─────────────────────────────────────── */
    .section-nav {
      display: inline-flex;
      align-items: center;
      background: var(--navy-06);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
      margin-bottom: 2rem;
    }

    .snav-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .42rem 1.1rem;
      border-radius: 999px;
      border: none;
      background: transparent;
      font-family: var(--font);
      font-size: .85rem;
      font-weight: 600;
      color: var(--navy-60);
      cursor: pointer;
      transition: background 180ms ease, color 180ms ease, box-shadow 180ms ease;
    }

    .snav-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .snav-btn.active { background: var(--navy); color: #fff; box-shadow: 0 2px 8px var(--navy-30); }
    .snav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Section views ───────────────────────────────────────────────── */
    .section-view { display: none; }
    .section-view.active { display: block; }

    /* ── DB header group ─────────────────────────────────────────────── */
    .db-header-group {
      border: 1.5px solid var(--border);
      border-radius: 14px;
      margin-bottom: .75rem;
      overflow: hidden;
      background: var(--surface);
      transition: border-color 300ms ease;
    }

    :root[data-theme="dark"] .db-header-group { background: var(--surface); }

    .db-header-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      text-align: left;
      color: var(--navy);
    }

    .db-header-trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .db-header-name { font-size: .98rem; font-weight: 700; color: var(--navy); }

    .db-header-count {
      font-size: .72rem; font-weight: 600; color: var(--navy-60);
      background: var(--navy-06); border: 1px solid var(--border);
      border-radius: 999px; padding: .15rem .6rem; margin-left: .5rem;
    }

    .db-header-chevron {
      flex-shrink: 0; width: 20px; height: 20px;
      color: var(--navy-60);
      transition: transform 300ms var(--ease-in-out);
    }

    .db-header-group.is-open .db-header-chevron { transform: rotate(180deg); }

    .db-header-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 350ms var(--ease-in-out);
    }

    .db-header-group.is-open .db-header-body { grid-template-rows: 1fr; }
    .db-header-body-inner { overflow: hidden; border-top: 1px solid var(--border); }

    /* ── DB sub-header label ─────────────────────────────────────────── */
    .db-subheader {
      padding: .65rem 1.25rem .3rem;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--navy-30);
    }

    /* ── DB query item ───────────────────────────────────────────────── */
    .db-item { border-top: 1px solid var(--border); }

    .db-trigger {
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      padding: .85rem 1.25rem;
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      text-align: left;
    }

    .db-trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .db-trigger-left { display: flex; align-items: center; gap: .6rem; flex: 1; min-width: 0; }

    .db-name { font-size: .93rem; font-weight: 600; color: var(--navy); line-height: 1.4; }
    .db-item:hover .db-name { color: var(--accent); }

    .db-badge {
      display: inline-flex; align-items: center;
      background: var(--navy-06); border: 1.5px solid var(--border);
      border-radius: 999px; font-size: .67rem; font-weight: 700;
      letter-spacing: .04em; color: var(--navy-60);
      padding: .18rem .6rem; white-space: nowrap; flex-shrink: 0;
    }

    .db-badge--postgres { background: rgba(51,103,145,.10); border-color: rgba(51,103,145,.30); color: #1e4d75; }
    :root[data-theme="dark"] .db-badge--postgres { background: rgba(51,103,145,.20); border-color: rgba(51,103,145,.40); color: #7ab3d4; }
    .db-badge--mysql { background: rgba(0,121,52,.10); border-color: rgba(0,121,52,.30); color: #005c27; }
    :root[data-theme="dark"] .db-badge--mysql { background: rgba(0,121,52,.20); border-color: rgba(0,121,52,.40); color: #4ade80; }
    .db-badge--sqlite { background: rgba(0,100,200,.10); border-color: rgba(0,100,200,.30); color: #004480; }
    :root[data-theme="dark"] .db-badge--sqlite { background: rgba(0,100,200,.20); border-color: rgba(0,100,200,.40); color: #93c5fd; }

    .db-trigger-chevron {
      flex-shrink: 0; width: 22px; height: 22px;
      border-radius: 50%; border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--navy-60); margin-top: .05rem;
      transition: background 200ms ease, border-color 200ms ease, transform 300ms var(--ease-in-out), color 200ms ease;
    }

    .db-item.is-open .db-trigger-chevron {
      background: var(--navy); border-color: var(--navy);
      color: #fff; transform: rotate(180deg);
    }

    .db-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 350ms var(--ease-in-out); }
    .db-item.is-open .db-body { grid-template-rows: 1fr; }
    .db-body-inner { overflow: hidden; }
    .db-body-content { padding: .2rem 1.25rem 1.25rem; }

    .db-description { font-size: .9rem; color: var(--navy-60); margin-bottom: .85rem; line-height: 1.65; }

    /* ── SQL block ───────────────────────────────────────────────────── */
    .sql-block {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--navy-06);
    }

    .sql-block__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .4rem .85rem;
      border-bottom: 1px solid var(--border);
      background: var(--navy-12);
    }

    .sql-block__lang {
      font-size: .67rem; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--navy-60);
    }

    .sql-block pre {
      margin: 0; padding: .85rem 1rem;
      font-family: var(--mono); font-size: .82rem;
      color: var(--navy); line-height: 1.75;
      overflow-x: auto; white-space: pre;
    }

    /* ── DB action row ───────────────────────────────────────────────── */
    .db-actions { display: flex; align-items: center; gap: .5rem; margin-top: .85rem; flex-wrap: wrap; }

    /* ── Modal mono textarea ─────────────────────────────────────────── */
    .modal-textarea.mono-mode {
      font-family: var(--mono);
      font-size: .84rem;
      line-height: 1.7;
    }

    /* ── Reduced motion ──────────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
      .faq-body { grid-template-rows: 0fr; }
      .faq-item.is-open .faq-body { grid-template-rows: 1fr; }
      .modal-overlay { opacity: 0; }
      .modal-overlay.is-open { opacity: 1; }
    }

    /* ── Responsive ──────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .hero { padding: 2rem 1rem 2.5rem; }
      .hero__title { font-size: clamp(1.9rem, 9vw, 2.75rem); }
      .content { padding: 0 1rem 5rem; }
      .search-hint { display: none; }
      .search-clear { right: 1rem; }
      .search-input { padding-right: 2.8rem; }
      .cta-section { padding: 2rem 1.25rem; }
      .back-top { bottom: 1.5rem; right: 1rem; }
      .modal-overlay { padding: 0; align-items: flex-end; }
      .modal-card { border-radius: 20px 20px 0 0; max-height: 82vh; border-bottom: none; }
      .modal-footer { flex-direction: column-reverse; align-items: stretch; }
      .modal-footer-actions { justify-content: stretch; }
      .modal-copy-answer-btn, .modal-copy-qa-btn { flex: 1; justify-content: center; }
      .faq-actions { gap: .4rem; }
      .action-pill { font-size: .75rem; padding: .38rem .8rem; }
      .faq-toolbar { flex-wrap: wrap; gap: .5rem; }
    }
  </style>
</head>

/* ─── Data is loaded from faq-data.js / db-data.js ─────────────────── */

  FAQ_DATA.forEach(function(item) {

  });
}
rebuildCategories();

function getCatCount(cat) {
  return cat === "All" ? FAQ_DATA.length : FAQ_DATA.filter(function(i){ return i.category===cat; }).length;
}

/* ─── Section config ─────────────────────────────────────────────────── */
var SECTION_CONFIGS = {

  }
};

/* ─── State ─────────────────────────────────────────────────────────── */
var state   = { query:"", activeCategory:"All", openIds:{}, votes:{} };

/* ─── DOM refs ──────────────────────────────────────────────────────── */

var mainLoadBtn    = document.getElementById("mainLoadBtn");

/* ─── Utilities ─────────────────────────────────────────────────────── */
function debounce(fn, delay) {
  var t;
  return function() { var a=arguments; clearTimeout(t); t=setTimeout(function(){ fn.apply(null,a); },delay); };
}

function escapeHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function highlightText(text, query) {
  if (!query) return escapeHtml(text);
  var safe = query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return text.split(new RegExp("("+safe+")","gi")).map(function(p,i){
    return i%2===1 ? "<mark>"+escapeHtml(p)+"</mark>" : escapeHtml(p);
  }).join("");
}

var toastTimer;
function showToast(msg, dur) {
  dur = dur || 2200;
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, dur);
}

function writeClipboard(text, cb) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(cb).catch(function(){ fallbackCopy(text,cb); });
  } else { fallbackCopy(text,cb); }
}

function fallbackCopy(text, cb) {
  var ta=document.createElement("textarea");
  ta.value=text; ta.style.cssText="position:fixed;top:0;left:0;opacity:0;pointer-events:none";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta); cb();
}

var CLIPBOARD_SVG =
  '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>' +
  '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>';
var CHECK_SVG =
  '<polyline points="20 6 9 17 4 12" stroke="currentColor"' +
  ' stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';

function morphCopyBtn(btn, iconEl, labelEl, successLabel, origLabel, origIconHtml) {
  btn.classList.add("is-copied");
  if (labelEl) labelEl.textContent = successLabel;
  if (iconEl)  iconEl.innerHTML = CHECK_SVG;
  clearTimeout(btn._rv);
  btn._rv = setTimeout(function(){
    btn.classList.remove("is-copied");
    if (labelEl) labelEl.textContent = origLabel;
    if (iconEl)  iconEl.innerHTML = origIconHtml;
  }, 1800);
}

/* ─── Dark mode ──────────────────────────────────────────────────────── */
var SUN_SVG  = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
var MOON_SVG = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

function buildThemeSVG(icon) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"' +
    ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    icon + '</svg>';
}

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  themeToggle.innerHTML = theme === "dark" ? buildThemeSVG(SUN_SVG) : buildThemeSVG(MOON_SVG);
  themeToggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
}

(function initTheme() {
  var saved = localStorage.getItem("faq-theme");
  var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(saved || (prefersDark ? "dark" : "light"));
})();

themeToggle.addEventListener("click", function() {
  var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  localStorage.setItem("faq-theme", next);
});

/* ─── Filter ─────────────────────────────────────────────────────────── */
function getFilteredData() {
  var q = state.query.toLowerCase(), cat = state.activeCategory;
  return FAQ_DATA.filter(function(item) {
    if (cat !== "All" && item.category !== cat) return false;
    if (!q) return true;
    return item.question.toLowerCase().indexOf(q)!==-1 || item.answer.toLowerCase().indexOf(q)!==-1;
  });
}

/* ─── Category tabs ──────────────────────────────────────────────────── */
function renderCategories() {
  categoriesEl.innerHTML = "";
  ALL_CATEGORIES.forEach(function(cat) {
    var btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === state.activeCategory ? " active" : "");
    btn.setAttribute("aria-pressed", String(cat === state.activeCategory));
    btn.innerHTML = escapeHtml(cat) + '<span class="cat-count">'+getCatCount(cat)+'</span>';
    btn.addEventListener("click", function(){
      state.activeCategory = cat; renderCategories(); renderFAQs();
    });
    categoriesEl.appendChild(btn);
  });
}

/* ─── Expand / Collapse all ──────────────────────────────────────────── */
function areAllOpen() {
  var items = getFilteredData();
  return items.length > 0 && items.every(function(i){ return !!state.openIds[i.id]; });
}

function setAllOpen(open) {
  getFilteredData().forEach(function(item) {
    state.openIds[item.id] = open;
    var el  = document.getElementById("faq-item-"    + item.id);
    var bod = document.getElementById("faq-body-"    + item.id);
    var trg = document.getElementById("faq-trigger-" + item.id);
    if (!el) return;
    el.classList.toggle("is-open", open);
    if (trg) trg.setAttribute("aria-expanded", String(open));
    if (bod) bod.setAttribute("aria-hidden",   String(!open));
  });
  updateExpandAllBtn();
}

function updateExpandAllBtn() {
  var allOpen = areAllOpen();
  var items   = getFilteredData();
  if (!items.length) { expandAllBtn.style.display = "none"; return; }
  expandAllBtn.style.display = "";
  expandAllLabel.textContent = allOpen ? "Collapse all" : "Expand all";
  expandAllBtn.setAttribute("aria-label", allOpen ? "Collapse all FAQ items" : "Expand all FAQ items");
  /* Rotate chevron when all open */
  var chevron = expandAllBtn.querySelector("svg");
  if (chevron) chevron.style.transform = allOpen ? "rotate(180deg)" : "rotate(0deg)";
}

expandAllBtn.addEventListener("click", function() { setAllOpen(!areAllOpen()); });

/* ─── Accordion toggle ───────────────────────────────────────────────── */
function toggleItem(id) {
  state.openIds[id] = !state.openIds[id];
  var el  = document.getElementById("faq-item-"    + id);
  var bod = document.getElementById("faq-body-"    + id);
  var trg = document.getElementById("faq-trigger-" + id);
  if (!el) return;
  var open = state.openIds[id];
  el.classList.toggle("is-open", open);
  if (trg) trg.setAttribute("aria-expanded", String(open));
  if (bod) bod.setAttribute("aria-hidden",   String(!open));
  updateExpandAllBtn();
}

/* ─── FAQ render ─────────────────────────────────────────────────────── */
function renderFAQs() {
  var items = getFilteredData();
  faqList.innerHTML = "";

  if (state.query) {
    resultsMeta.textContent = items.length
      ? items.length + " result" + (items.length!==1?"s":"") + " for “" + state.query + "”"
      : "";
  } else {
    resultsMeta.textContent = items.length + " question" + (items.length!==1?"s":"");
  }

  if (items.length === 0) {
    expandAllBtn.style.display = "none";
    faqList.innerHTML =
      '<div class="empty-state" role="status">' +
        '<div class="empty-icon" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
            '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/>' +
          '</svg></div>' +
        '<p class="empty-state__title">No results found</p>' +
        '<p class="empty-state__sub">Try a different keyword, or browse a category.</p>' +
        '<div class="empty-state__suggestions">' +
          '<button class="suggestion-chip" data-suggest="free trial">free trial</button>' +
          '<button class="suggestion-chip" data-suggest="pricing">pricing</button>' +
          '<button class="suggestion-chip" data-suggest="cancel">cancel</button>' +
          '<button class="suggestion-chip" data-suggest="invoice">invoice</button>' +
        '</div></div>';
    faqList.querySelectorAll(".suggestion-chip").forEach(function(chip) {
      chip.addEventListener("click", function(){
        var t=chip.getAttribute("data-suggest");
        searchInput.value=t; state.query=t; updateClearBtn(); renderFAQs();
      });
    });
    return;
  }

  items.forEach(function(item, index) {
    var isOpen = !!state.openIds[item.id];
    var vote   = state.votes[item.id];

    var el = document.createElement("div");
    el.className  = "faq-item faq-item--entering" + (isOpen ? " is-open" : "");
    el.id         = "faq-item-" + item.id;
    el.setAttribute("data-id", String(item.id));
    el.style.transitionDelay = (index * 45) + "ms";

    var helpfulHtml = vote
      ? '<span class="faq-helpful__thanks">Thanks for your feedback!</span>'
      : '<span class="faq-helpful__label">Was this helpful?</span>' +
        '<button class="helpful-btn" data-vote="yes" data-faq-id="'+item.id+'" aria-label="Yes, helpful">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/>' +
            '<path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>Yes</button>' +
        '<button class="helpful-btn" data-vote="no" data-faq-id="'+item.id+'" aria-label="No, not helpful">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/>' +
            '<path d="M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg>No</button>';

    el.innerHTML =
      '<button class="faq-trigger" id="faq-trigger-'+item.id+'"' +
          ' aria-expanded="'+isOpen+'" aria-controls="faq-body-'+item.id+'">' +
        '<span class="faq-question">'+highlightText(item.question, state.query)+'</span>' +
        '<span class="faq-icon" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
            '<line x1="12" y1="5" x2="12" y2="19" class="faq-icon-v"/>' +
            '<line x1="5" y1="12" x2="19" y2="12"/>' +
          '</svg></span>' +
      '</button>' +
      '<div class="faq-body" id="faq-body-'+item.id+'"' +
           ' role="region" aria-labelledby="faq-trigger-'+item.id+'" aria-hidden="'+!isOpen+'">' +
        '<div class="faq-body-inner"><div class="faq-answer-wrap">' +
          '<p class="faq-answer">'+highlightText(item.answer, state.query)+'</p>' +

          /* ── 3-button action row ── */
          '<div class="faq-actions">' +

            /* Copy Q&A */
            '<button class="action-pill copy-btn" data-faq-id="'+item.id+'" aria-label="Copy Q&amp;A">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+CLIPBOARD_SVG+'</svg>' +
              '<span>Copy</span>' +
              '<span class="action-tooltip" aria-hidden="true">Copy Q&amp;A to clipboard</span>' +
            '</button>' +

            /* Edit & Copy */
            '<button class="action-pill edit-copy-btn" data-faq-id="'+item.id+'" aria-label="Edit then copy">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>' +
                '<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>' +
              '</svg>' +
              '<span>Edit &amp; Copy</span>' +
              '<span class="action-tooltip" aria-hidden="true">Edit before copying</span>' +
            '</button>' +

          '</div>' +

          '<div class="faq-helpful">'+helpfulHtml+'</div>' +
        '</div></div></div>';

    /* Accordion toggle */
    (function(faqId){
      el.querySelector(".faq-trigger").addEventListener("click", function(){ toggleItem(faqId); });
    })(item.id);

    /* Copy Q&A */
    (function(faqItem){
      var btn = el.querySelector(".copy-btn");
      var ico = btn.querySelector("svg");
      var lbl = btn.querySelector("span");
      var tip = btn.querySelector(".action-tooltip");
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        writeClipboard("Q: "+faqItem.question+"\n\nA: "+faqItem.answer, function(){
          morphCopyBtn(btn, ico, lbl, "Copied!", "Copy", CLIPBOARD_SVG);
          if (tip) { tip.textContent="Copied!"; setTimeout(function(){ tip.textContent="Copy Q&A to clipboard"; },1800); }
        });
      });
    })(item);

    /* Edit & Copy → modal */
    (function(faqItem){
      var editBtn = el.querySelector(".edit-copy-btn");
      editBtn.addEventListener("click", function(e){ e.stopPropagation(); openModal(faqItem, editBtn); });
    })(item);


    /* Helpful votes */
    el.querySelectorAll(".helpful-btn").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var faqId=parseInt(btn.getAttribute("data-faq-id"),10);
        var v=btn.getAttribute("data-vote");
        state.votes[faqId]=v;
        showToast(v==="yes" ? "Thanks! Glad that helped." : "Thanks for the feedback — we'll improve this.");
        var hd=el.querySelector(".faq-helpful");
        if(hd) hd.innerHTML='<span class="faq-helpful__thanks">Thanks for your feedback!</span>';
      });
    });

    faqList.appendChild(el);

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.classList.remove("faq-item--entering");
        el.addEventListener("transitionend", function clr(evt){
          if(evt.propertyName==="opacity"){ el.style.transitionDelay=""; el.removeEventListener("transitionend",clr); }
        });
      });
    });
  });

  updateExpandAllBtn();
}

/* ─── Search ─────────────────────────────────────────────────────────── */
function updateClearBtn() {
  var q = currentSection === "tickets" ? state.query : dbState.query;
  searchClear.classList.toggle("visible", q.length > 0);
  searchClear.tabIndex = q.length > 0 ? 0 : -1;
}

searchInput.addEventListener("input", debounce(function(){
  var q = searchInput.value.trim();
  if (currentSection === "tickets") { state.query = q; updateClearBtn(); renderFAQs(); }
  else { dbState.query = q; updateClearBtn(); renderDB(); }
}, 200));

searchClear.addEventListener("click", function(){
  searchInput.value = "";
  if (currentSection === "tickets") { state.query = ""; updateClearBtn(); renderFAQs(); }
  else { dbState.query = ""; updateClearBtn(); renderDB(); }

/* ─── Section switching ───────────────────────────────────────────────── */
function switchSection(section) {
  currentSection = section;
  var cfg = SECTION_CONFIGS[section];
  heroBadgeText.textContent = cfg.badge;
  heroTitle.innerHTML = cfg.title;
  heroSub.textContent = cfg.sub;

  searchInput.value = "";

  viewDB.classList.toggle("active", section === "db");
  snavTickets.classList.toggle("active", section === "tickets");
  snavDB.classList.toggle("active", section === "db");

  snavDB.setAttribute("aria-selected", String(section === "db"));

}

snavDB.addEventListener("click",      function(){ switchSection("db"); });

/* ─── DB filter ───────────────────────────────────────────────────────── */
function getDBFiltered() {
  var q = dbState.query.toLowerCase();
  return DB_DATA.filter(function(item) {
    if (!q) return true;
    return item.name.toLowerCase().indexOf(q) !== -1 ||
           item.description.toLowerCase().indexOf(q) !== -1 ||
           item.sql.toLowerCase().indexOf(q) !== -1 ||
           item.header.toLowerCase().indexOf(q) !== -1;
  });
}

/* ─── DB render ───────────────────────────────────────────────────────── */
function renderDB() {
  var items = getDBFiltered();
  dbList.innerHTML = "";

  if (dbState.query) {
    dbResultsMeta.textContent = items.length
      ? items.length + " result" + (items.length !== 1 ? "s" : "") + " for “" + dbState.query + "”"
      : "No results for “" + dbState.query + "”";
  } else {
    dbResultsMeta.textContent = items.length + " quer" + (items.length !== 1 ? "ies" : "y");
  }

  if (!items.length) {
    dbList.innerHTML = '<div class="empty-state" role="status">' +
      '<div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div>' +
      '<p class="empty-state__title">No queries found</p>' +
      '<p class="empty-state__sub">Try a different keyword.</p></div>';
    if (dbExpandAllBtn) dbExpandAllBtn.style.display = "none";
    return;
  }

  /* Group by header → subheader */
  var headerOrder = [], headerMap = {};
  items.forEach(function(item) {
    if (!headerMap[item.header]) { headerMap[item.header] = {}; headerOrder.push(item.header); }
    if (!headerMap[item.header][item.subheader]) headerMap[item.header][item.subheader] = [];
    headerMap[item.header][item.subheader].push(item);
  });

  headerOrder.forEach(function(header) {
    var subMap = headerMap[header];
    var isOpen = !!dbState.openHeaders[header];
    var totalItems = Object.keys(subMap).reduce(function(acc, k){ return acc + subMap[k].length; }, 0);
    var safeId = header.replace(/[^a-zA-Z0-9]/g, "-");

    var innerHtml = "";
    Object.keys(subMap).forEach(function(subheader) {
      innerHtml += '<div class="db-subheader">' + escapeHtml(subheader) + '</div>';
      subMap[subheader].forEach(function(item) {
        var isItemOpen = !!dbState.openItems[item.id];
        var badgeCls = "db-badge";
        var db = (item.database || "").toLowerCase();
        if (db.indexOf("postgres") !== -1) badgeCls += " db-badge--postgres";
        else if (db.indexOf("mysql") !== -1) badgeCls += " db-badge--mysql";
        else if (db.indexOf("sqlite") !== -1) badgeCls += " db-badge--sqlite";

        innerHtml +=
          '<div class="db-item' + (isItemOpen ? " is-open" : "") + '" id="db-item-' + item.id + '">' +
            '<button class="db-trigger" aria-expanded="' + isItemOpen + '" aria-controls="db-body-' + item.id + '">' +
              '<div class="db-trigger-left">' +
                '<span class="' + badgeCls + '">' + escapeHtml(item.database) + '</span>' +
                '<span class="db-name">' + highlightText(item.name, dbState.query) + '</span>' +
              '</div>' +
              '<span class="db-trigger-chevron" aria-hidden="true">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:10px;height:10px"><polyline points="6 9 12 15 18 9"/></svg>' +
              '</span>' +
            '</button>' +
            '<div class="db-body" id="db-body-' + item.id + '" aria-hidden="' + !isItemOpen + '">' +
              '<div class="db-body-inner"><div class="db-body-content">' +
                '<p class="db-description">' + highlightText(item.description, dbState.query) + '</p>' +
                '<div class="sql-block">' +
                  '<div class="sql-block__header"><span class="sql-block__lang">SQL</span></div>' +
                  '<pre><code>' + escapeHtml(item.sql) + '</code></pre>' +
                '</div>' +
                '<div class="db-actions">' +
                  '<button class="action-pill copy-btn db-copy-sql" data-db-id="' + item.id + '" aria-label="Copy SQL">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + CLIPBOARD_SVG + '</svg>' +
                    '<span>Copy SQL</span>' +
                    '<span class="action-tooltip" aria-hidden="true">Copy SQL to clipboard</span>' +
                  '</button>' +
                  '<button class="action-pill edit-copy-btn db-edit-copy" data-db-id="' + item.id + '" aria-label="Edit &amp; Copy">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                      '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>' +
                      '<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>' +
                    '</svg>' +
                    '<span>Edit &amp; Copy</span>' +
                    '<span class="action-tooltip" aria-hidden="true">Edit before copying</span>' +
                  '</button>' +
                '</div>' +
              '</div></div>' +
            '</div>' +
          '</div>';
      });
    });

    var group = document.createElement("div");
    group.className = "db-header-group" + (isOpen ? " is-open" : "");
    group.id = "db-hg-" + safeId;
    group.innerHTML =
      '<button class="db-header-trigger" aria-expanded="' + isOpen + '" aria-controls="db-hb-' + safeId + '">' +
        '<div style="display:flex;align-items:center">' +
          '<span class="db-header-name">' + escapeHtml(header) + '</span>' +
          '<span class="db-header-count">' + totalItems + ' quer' + (totalItems !== 1 ? "ies" : "y") + '</span>' +
        '</div>' +
        '<svg class="db-header-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>' +
      '</button>' +
      '<div class="db-header-body" id="db-hb-' + safeId + '" aria-hidden="' + !isOpen + '">' +
        '<div class="db-header-body-inner">' + innerHtml + '</div>' +
      '</div>';

    /* Header toggle */
    (function(hdr, grp) {
      grp.querySelector(".db-header-trigger").addEventListener("click", function() {
        dbState.openHeaders[hdr] = !dbState.openHeaders[hdr];
        var open = dbState.openHeaders[hdr];
        grp.classList.toggle("is-open", open);
        grp.querySelector(".db-header-body").setAttribute("aria-hidden", String(!open));
        grp.querySelector(".db-header-trigger").setAttribute("aria-expanded", String(open));
        updateDBExpandAllBtn();
      });
    })(header, group);

    /* Item toggles + buttons */
    group.querySelectorAll(".db-item").forEach(function(dbItemEl) {
      var dbId = parseInt(dbItemEl.id.replace("db-item-", ""), 10);
      var dbItem = null;
      for (var i = 0; i < DB_DATA.length; i++) { if (DB_DATA[i].id === dbId) { dbItem = DB_DATA[i]; break; } }
      if (!dbItem) return;

      dbItemEl.querySelector(".db-trigger").addEventListener("click", function() {
        dbState.openItems[dbId] = !dbState.openItems[dbId];
        var open = dbState.openItems[dbId];
        dbItemEl.classList.toggle("is-open", open);
        dbItemEl.querySelector(".db-body").setAttribute("aria-hidden", String(!open));
        dbItemEl.querySelector(".db-trigger").setAttribute("aria-expanded", String(open));
        updateDBExpandAllBtn();
      });

      var copyBtn = dbItemEl.querySelector(".db-copy-sql");
      (function(btn, it) {
        var ico = btn.querySelector("svg");
        var lbl = btn.querySelector("span");
        btn.addEventListener("click", function(e) {
          e.stopPropagation();
          writeClipboard(it.sql, function() {
            morphCopyBtn(btn, ico, lbl, "Copied!", "Copy SQL", CLIPBOARD_SVG);
            showToast("SQL copied to clipboard");
          });
        });
      })(copyBtn, dbItem);

      var editBtn = dbItemEl.querySelector(".db-edit-copy");
      (function(btn, it) {
        btn.addEventListener("click", function(e) {
          e.stopPropagation();
          openModal(it, btn, "db");
        });
      })(editBtn, dbItem);
    });

    dbList.appendChild(group);
  });

  updateDBExpandAllBtn();
}

function updateDBExpandAllBtn() {
  if (!dbExpandAllBtn) return;
  var items = getDBFiltered();
  if (!items.length) { dbExpandAllBtn.style.display = "none"; return; }
  dbExpandAllBtn.style.display = "";
  var allOpen = items.every(function(i) { return dbState.openItems[i.id]; });
  dbExpandLbl.textContent = allOpen ? "Collapse all" : "Expand all";
  var chevron = dbExpandAllBtn.querySelector("svg");
  if (chevron) chevron.style.transform = allOpen ? "rotate(180deg)" : "";
}

if (dbExpandAllBtn) {
  dbExpandAllBtn.addEventListener("click", function() {
    var open = !getDBFiltered().every(function(i) { return dbState.openItems[i.id]; });
    getDBFiltered().forEach(function(item) { dbState.openItems[item.id] = open; });
    DB_DATA.forEach(function(item) { dbState.openHeaders[item.header] = open; });
    renderDB();
  });
}

/* ─── Load File (single button — reads both sheets) ──────────────────── */
mainLoadBtn.addEventListener("click", function() { mainExcelInput.click(); });

mainExcelInput.addEventListener("change", function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var workbook = XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
      var loaded = [];

      workbook.SheetNames.forEach(function(name) {
        var rows = XLSX.utils.sheet_to_json(workbook.Sheets[name]);
        if (!rows.length) return;
        var sample = rows[0];
        var keys = Object.keys(sample).map(function(k){ return k.toLowerCase(); });

        /* Detect Ticket Replies sheet by column presence */
        if (keys.indexOf("question") !== -1 || keys.indexOf("answer") !== -1) {
          var parsed = rows.map(function(row, i) {
            return {
              id:       Number(row["id"]       || row["ID"]       || i + 1),
              category: String(row["category"] || row["Category"] || "General"),
              question: String(row["question"] || row["Question"] || ""),
              answer:   String(row["answer"]   || row["Answer"]   || "")
            };
          }).filter(function(r){ return r.question && r.answer; });
          if (parsed.length) {
            FAQ_DATA = parsed;
            rebuildCategories();
            state.openIds = {}; state.activeCategory = "All"; state.query = "";
            renderCategories(); renderFAQs();
            loaded.push(parsed.length + " ticket replies");
          }

        /* Detect DB Queries sheet */
        } else if (keys.indexOf("sql") !== -1 || keys.indexOf("header") !== -1) {
          var parsed = rows.map(function(row, i) {
            return {
              id:          Number(row["id"]          || i + 1),
              header:      String(row["header"]      || "General"),
              subheader:   String(row["subheader"]   || "Queries"),
              category:    String(row["category"]    || "SELECT"),
              database:    String(row["database"]    || "PostgreSQL"),
              name:        String(row["name"]        || ""),
              description: String(row["description"] || ""),
              sql:         String(row["sql"]         || "")
            };
          }).filter(function(r){ return r.name && r.sql; });
          if (parsed.length) {
            DB_DATA = parsed;
            dbState.openHeaders = {}; dbState.openItems = {}; dbState.query = "";
            renderDB();
            loaded.push(parsed.length + " DB queries");
          }
        }
      });

      if (!loaded.length) {
        showToast("No valid data found. Check sheet columns.", 3000);
        return;
      }
      searchInput.value = ""; updateClearBtn();
      var shortName = file.name.length > 24 ? file.name.slice(0, 22) + "…" : file.name;
      mainLoadLabel.textContent = shortName;
      mainLoadBtn.classList.add("loaded");
      showToast("Loaded " + loaded.join(" and ") + " from " + file.name, 2800);
    } catch(err) {
      showToast("Could not read file — make sure it is a valid .xlsx file", 3000);
    }
    mainExcelInput.value = "";
  };
  reader.readAsArrayBuffer(file);
});

/* ─── Keyboard shortcuts ─────────────────────────────────────────────── */
document.addEventListener("keydown", function(e){
  var active = document.activeElement;
  var tag    = active ? active.tagName.toLowerCase() : "";
  var inInput= tag==="input" || tag==="textarea" || (active && active.isContentEditable);
  var modalOpen = modalOverlay.classList.contains("is-open");

  if (e.key==="/" && !inInput && !modalOpen) { e.preventDefault(); searchInput.focus(); searchInput.select(); return; }
  if (e.key==="Escape" && inInput && !modalOpen) { searchInput.value=""; state.query=""; updateClearBtn(); renderFAQs(); searchInput.blur(); return; }
  if ((e.key==="ArrowDown"||e.key==="ArrowUp") && !inInput && !modalOpen) {
    var trgs = Array.from(faqList.querySelectorAll(".faq-trigger"));
    if (!trgs.length) return;
    var idx = trgs.indexOf(document.activeElement);
    idx = e.key==="ArrowDown" ? (idx<trgs.length-1?idx+1:0) : (idx>0?idx-1:trgs.length-1);
    e.preventDefault(); trgs[idx].focus();
  }
});

/* ═══════════════════════════════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════════════════════════════ */
var modalOriginal = { question:"", answer:"" };
var modalTriggerEl = null;
var currentModalMode = "tickets";

function autoResize(ta) { ta.style.height="auto"; ta.style.height=(ta.scrollHeight+2)+"px"; }

function updateWordCount() {
  var t=modalAnswer.value.trim();
  var w=t?t.split(/\s+/).length:0;
  modalWordCount.textContent = w+" word"+(w!==1?"s":"")+" · "+modalAnswer.value.length+" ch";
}

function updateEditBadges() {
  qEditBadge.classList.toggle("visible", modalQuestion.value!==modalOriginal.question);
  aEditBadge.classList.toggle("visible", modalAnswer.value!==modalOriginal.answer);
}

function openModal(item, triggerEl, mode) {
  mode = mode || "tickets";
  currentModalMode = mode;
  modalTriggerEl = triggerEl || null;

  if (mode === "db") {
    modalOriginal.question = item.name;
    modalOriginal.answer   = item.sql;
    modalCatBadge.textContent = item.database;
    if (modalQLbl) modalQLbl.textContent = "QUERY NAME";
    if (modalALbl) modalALbl.textContent = "SQL";
    modalQuestion.value = item.name;
    modalAnswer.value   = item.sql;
    modalAnswer.classList.add("mono-mode");
    modalCopyAnswer.querySelector("span").textContent = "Copy SQL";
    modalCopyQA.querySelector("span").textContent     = "Copy name + SQL";
  } else {
    modalOriginal.question = item.question;
    modalOriginal.answer   = item.answer;
    modalCatBadge.textContent = item.category;
    if (modalQLbl) modalQLbl.textContent = "QUESTION";
    if (modalALbl) modalALbl.textContent = "ANSWER";
    modalQuestion.value = item.question;
    modalAnswer.value   = item.answer;
    modalAnswer.classList.remove("mono-mode");
    modalCopyAnswer.querySelector("span").textContent = "Copy answer";
    modalCopyQA.querySelector("span").textContent     = "Copy Q&A";
  }

  qEditBadge.classList.remove("visible");
  aEditBadge.classList.remove("visible");
  modalCopyAnswer.classList.remove("is-copied");
  modalCopyQA.classList.remove("is-copied");
  modalCopyAnswer.querySelector("svg").innerHTML = CLIPBOARD_SVG;
  modalCopyQA.querySelector("svg").innerHTML     = '<polyline points="20 6 9 17 4 12"/>';

  modalOverlay.classList.add("is-open");
  modalOverlay.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";

  requestAnimationFrame(function(){
    autoResize(modalQuestion); autoResize(modalAnswer); updateWordCount();
    setTimeout(function(){ modalQuestion.focus(); modalQuestion.setSelectionRange(0,0); }, 230);
  });
}

function closeModal() {
  modalOverlay.classList.remove("is-open");
  modalOverlay.setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
  if (modalTriggerEl) setTimeout(function(){ if(modalTriggerEl) modalTriggerEl.focus(); }, 240);
}

function getModalFocusable() {
  return Array.from(modalOverlay.querySelectorAll(
    'button:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
  )).filter(function(el){ return el.offsetParent!==null; });
}

modalOverlay.addEventListener("keydown", function(e){
  if (e.key==="Escape") { closeModal(); return; }
  if (e.key!=="Tab") return;
  var f=getModalFocusable();
  if (!f.length) return;
  if (e.shiftKey) { if(document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus();} }
  else            { if(document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus();} }
});

modalOverlay.addEventListener("click", function(e){ if(e.target===modalOverlay) closeModal(); });
modalClose.addEventListener("click", closeModal);

modalQuestion.addEventListener("input", function(){ autoResize(modalQuestion); updateEditBadges(); });
modalAnswer.addEventListener("input",   function(){ autoResize(modalAnswer); updateWordCount(); updateEditBadges(); });

modalReset.addEventListener("click", function(){
  modalQuestion.value=modalOriginal.question; modalAnswer.value=modalOriginal.answer;
  autoResize(modalQuestion); autoResize(modalAnswer); updateWordCount(); updateEditBadges(); modalQuestion.focus();
});

modalCopyAnswer.addEventListener("click", function(){
  var origLabel = currentModalMode === "db" ? "Copy SQL" : "Copy answer";
  writeClipboard(modalAnswer.value, function(){
    morphCopyBtn(modalCopyAnswer, modalCopyAnswer.querySelector("svg"), modalCopyAnswer.querySelector("span"), "Copied!", origLabel, CLIPBOARD_SVG);
    showToast(currentModalMode === "db" ? "SQL copied to clipboard" : "Answer copied to clipboard");
  });
});

modalCopyQA.addEventListener("click", function(){
  var text, origLabel;
  if (currentModalMode === "db") {
    text = "-- " + modalQuestion.value.trim() + "\n" + modalAnswer.value.trim();
    origLabel = "Copy name + SQL";
  } else {
    text = "Q: "+modalQuestion.value.trim()+"\n\nA: "+modalAnswer.value.trim();
    origLabel = "Copy Q&A";
  }
  writeClipboard(text, function(){
    morphCopyBtn(modalCopyQA, modalCopyQA.querySelector("svg"), modalCopyQA.querySelector("span"), "Copied!", origLabel, '<polyline points="20 6 9 17 4 12"/>');
    showToast(currentModalMode === "db" ? "SQL copied to clipboard" : "Q⁠&⁠A copied to clipboard");
  });
});

/* (Load File handler is the unified one above — no separate per-section handler) */

/* ─── Boot ───────────────────────────────────────────────────────────── */
renderCategories();
renderFAQs();
renderDB(); /* pre-render DB so it's ready when user switches */

/* Default: open first item */
if (FAQ_DATA.length > 0) {
  var fid = FAQ_DATA[0].id;
  state.openIds[fid] = true;
  var fe=document.getElementById("faq-item-"+fid), ft=document.getElementById("faq-trigger-"+fid), fb=document.getElementById("faq-body-"+fid);
  if(fe) fe.classList.add("is-open");
  if(ft) ft.setAttribute("aria-expanded","true");
  if(fb) fb.setAttribute("aria-hidden","false");
  updateExpandAllBtn();
}

</script>

</body>
</html>
