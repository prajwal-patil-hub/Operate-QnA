<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ – Help Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ───────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ──────────────────────────────────────────────────────── */
    :root {
      --bg:           #F2EDE3;
      --navy:         #1C2D6E;
      --navy-90:      rgba(28,45,110,.90);
      --navy-60:      rgba(28,45,110,.60);
      --navy-30:      rgba(28,45,110,.30);
      --navy-12:      rgba(28,45,110,.12);
      --navy-06:      rgba(28,45,110,.06);
      --border:       rgba(28,45,110,.18);
      --accent:       #2B4DB3;
      --accent-light: rgba(43,77,179,.10);
      --green:        #16a34a;
      --green-light:  #dcfce7;
      --red:          #dc2626;
      --red-light:    #fee2e2;
      --highlight:    #fef08a;
      --font:         'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --ease-out:     cubic-bezier(0.22, 1, 0.36, 1);
      --ease-in-out:  cubic-bezier(0.4, 0, 0.2, 1);
    }

    html { scroll-behavior: smooth; font-size: 16px; }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: var(--font);
      color: var(--navy);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Hero ────────────────────────────────────────────────────────── */
    .hero {
      position: relative;
      overflow: hidden;
      padding: 3rem 1.5rem 3.5rem;
      background:
        radial-gradient(circle, var(--navy-12) 1px, transparent 1px),
        var(--bg);
      background-size: 28px 28px, auto;
      border-bottom: 1px solid var(--border);
    }

    /* Soft radial fade so grid fades to cream at bottom */
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
        transparent 0%,
        transparent 50%,
        var(--bg) 100%);
      pointer-events: none;
    }

    .hero__inner {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
    }

    /* FAQs badge */
    .hero__badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      border: 1.5px solid var(--navy);
      border-radius: 999px;
      padding: .25rem .85rem;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--navy);
      margin-bottom: 1.25rem;
      background: transparent;
    }

    .hero__badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--navy);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.4); opacity: .6; }
    }

    .hero__title {
      font-size: clamp(2.25rem, 6vw, 3.75rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -.03em;
      color: var(--navy);
      margin-bottom: .75rem;
    }

    .hero__sub {
      font-size: 1.05rem;
      color: var(--navy-60);
      max-width: 480px;
      margin-bottom: 2rem;
    }

    /* ── Search ──────────────────────────────────────────────────────── */
    .search-wrap {
      position: relative;
      max-width: 540px;
    }

    .search-icon {
      position: absolute;
      left: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--navy-60);
      width: 18px;
      height: 18px;
      pointer-events: none;
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      padding: .9rem 7rem .9rem 2.9rem;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(8px);
      font-family: var(--font);
      font-size: .975rem;
      color: var(--navy);
      box-shadow: 0 2px 8px var(--navy-12);
      transition:
        border-color 200ms var(--ease-in-out),
        box-shadow   200ms var(--ease-in-out);
      outline: none;
      appearance: none;
    }

    .search-input::placeholder { color: var(--navy-30); }
    .search-input::-webkit-search-cancel-button { display: none; }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-light), 0 2px 8px var(--navy-12);
    }

    /* Clear button */
    .search-clear {
      position: absolute;
      right: 4.5rem;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border: none;
      background: var(--navy-12);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--navy-60);
      opacity: 0;
      pointer-events: none;
      transition:
        opacity     150ms ease,
        background  150ms ease,
        color       150ms ease,
        transform   100ms ease;
    }

    .search-clear.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .search-clear:hover { background: var(--navy-30); color: var(--navy); }
    .search-clear:active { transform: translateY(-50%) scale(.9); }
    .search-clear svg { width: 12px; height: 12px; }

    /* Keyboard hint */
    .search-hint {
      position: absolute;
      right: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: .3rem;
      pointer-events: none;
    }

    .kbd {
      display: inline-block;
      background: rgba(255,255,255,.7);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: .7rem;
      font-family: var(--font);
      color: var(--navy-60);
      padding: .1rem .4rem;
      line-height: 1.5;
      font-weight: 600;
    }

    /* ── Content wrapper ─────────────────────────────────────────────── */
    .content {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 1.5rem 6rem;
    }

    /* ── Category Filter Tabs ────────────────────────────────────────── */
    .categories {
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
      padding: 1.75rem 0 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .cat-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      font-family: var(--font);
      font-size: .82rem;
      font-weight: 600;
      color: var(--navy-60);
      padding: .35rem .9rem;
      cursor: pointer;
      transition:
        background     180ms ease,
        border-color   180ms ease,
        color          180ms ease,
        transform      100ms ease,
        box-shadow     180ms ease;
    }

    .cat-btn:hover {
      background: var(--navy-06);
      border-color: var(--navy-30);
      color: var(--navy);
    }

    .cat-btn:active { transform: scale(.96); }

    .cat-btn.active {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
      box-shadow: 0 2px 8px var(--navy-30);
    }

    .cat-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .cat-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 .4rem;
      border-radius: 999px;
      font-size: .68rem;
      font-weight: 700;
      background: var(--navy-12);
      color: var(--navy-60);
      transition: background 180ms ease, color 180ms ease;
    }

    .cat-btn.active .cat-count {
      background: rgba(255,255,255,.25);
      color: #fff;
    }

    /* ── Results meta ────────────────────────────────────────────────── */
    .results-meta {
      font-size: .82rem;
      font-weight: 500;
      color: var(--navy-60);
      padding: 1rem 0 .25rem;
      min-height: 2.5rem;
      display: flex;
      align-items: center;
    }

    /* ── FAQ List ────────────────────────────────────────────────────── */
    .faq-list {
      border-top: 1px solid var(--border);
    }

    /* ── FAQ Item ────────────────────────────────────────────────────── */
    .faq-item {
      border-bottom: 1px solid var(--border);
      /* entry animation state */
      opacity: 1;
      transform: translateY(0);
      transition:
        opacity   300ms var(--ease-out),
        transform 300ms var(--ease-out);
    }

    .faq-item--entering {
      opacity: 0;
      transform: translateY(8px);
    }

    /* ── Trigger button ──────────────────────────────────────────────── */
    .faq-trigger {
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 1.4rem 0;
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      text-align: left;
      color: var(--navy);
      transition: color 150ms ease;
    }

    .faq-trigger:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .faq-question {
      font-size: 1.0rem;
      font-weight: 700;
      line-height: 1.45;
      color: var(--navy);
      flex: 1;
      transition: color 150ms ease;
    }

    .faq-item:hover .faq-question { color: var(--accent); }

    /* Icon container — rotates for open/close */
    .faq-icon {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: .1rem;
      background: transparent;
      transition:
        background    200ms ease,
        border-color  200ms ease,
        transform     300ms var(--ease-in-out);
      color: var(--navy);
    }

    .faq-item:hover .faq-icon {
      background: var(--navy-06);
      border-color: var(--navy-30);
    }

    .faq-item.is-open .faq-icon {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
    }

    .faq-icon svg {
      width: 12px;
      height: 12px;
      transition: transform 300ms var(--ease-in-out);
    }

    /* The vertical bar of the plus — hidden when open */
    .faq-icon-v {
      transition: transform 300ms var(--ease-in-out), opacity 300ms ease;
    }

    .faq-item.is-open .faq-icon-v {
      transform: rotate(90deg);
      opacity: 0;
    }

    /* ── Accordion body (CSS grid trick — smooth height) ─────────────── */
    .faq-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 350ms var(--ease-in-out);
    }

    .faq-item.is-open .faq-body {
      grid-template-rows: 1fr;
    }

    .faq-body-inner {
      overflow: hidden;
    }

    .faq-answer-wrap {
      padding-bottom: 1.5rem;
    }

    .faq-answer {
      font-size: .97rem;
      color: var(--navy-90);
      line-height: 1.75;
      max-width: 600px;
    }

    /* ── Helpful widget ──────────────────────────────────────────────── */
    .faq-helpful {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--navy-12);
    }

    .faq-helpful__label {
      font-size: .8rem;
      font-weight: 600;
      color: var(--navy-60);
    }

    .helpful-btn {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      font-family: var(--font);
      font-size: .78rem;
      font-weight: 600;
      color: var(--navy-60);
      padding: .28rem .75rem;
      cursor: pointer;
      transition:
        background    160ms ease,
        border-color  160ms ease,
        color         160ms ease,
        transform     100ms ease;
    }

    .helpful-btn:hover {
      background: var(--navy-06);
      border-color: var(--navy-30);
      color: var(--navy);
    }

    .helpful-btn:active { transform: scale(.94); }

    .helpful-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .helpful-btn.voted-yes {
      background: var(--green-light);
      border-color: #86efac;
      color: var(--green);
    }

    .helpful-btn.voted-no {
      background: var(--red-light);
      border-color: #fca5a5;
      color: var(--red);
    }

    .helpful-btn svg { width: 13px; height: 13px; }

    .faq-helpful__thanks {
      font-size: .8rem;
      color: var(--navy-60);
      font-style: italic;
    }

    /* ── Highlight ───────────────────────────────────────────────────── */
    mark {
      background: var(--highlight);
      color: inherit;
      border-radius: 2px;
      padding: 0 .1em;
    }

    /* ── Empty state ─────────────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 5rem 2rem;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      background: var(--navy-06);
      border: 1.5px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      color: var(--navy-60);
    }

    .empty-icon svg { width: 28px; height: 28px; }

    .empty-state__title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: .5rem;
    }

    .empty-state__sub {
      font-size: .9rem;
      color: var(--navy-60);
      margin-bottom: 1.5rem;
    }

    .empty-state__suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      justify-content: center;
    }

    .suggestion-chip {
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: .35rem .9rem;
      font-size: .82rem;
      font-weight: 600;
      color: var(--navy-60);
      background: transparent;
      cursor: pointer;
      font-family: var(--font);
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
    }

    .suggestion-chip:hover {
      background: var(--navy-06);
      border-color: var(--navy-30);
      color: var(--navy);
    }

    /* ── CTA section ─────────────────────────────────────────────────── */
    .cta-section {
      margin-top: 3.5rem;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
      background: linear-gradient(135deg, var(--navy-06) 0%, transparent 100%);
      position: relative;
      overflow: hidden;
    }

    .cta-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle, var(--navy-12) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: .5;
      pointer-events: none;
    }

    .cta-section__inner { position: relative; z-index: 1; }

    .cta-section__icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--navy);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }

    .cta-section__icon svg { width: 24px; height: 24px; }

    .cta-section__title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: .4rem;
    }

    .cta-section__sub {
      font-size: .9rem;
      color: var(--navy-60);
      margin-bottom: 1.5rem;
      max-width: 380px;
      margin-left: auto;
      margin-right: auto;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-family: var(--font);
      font-size: .9rem;
      font-weight: 700;
      padding: .75rem 1.75rem;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--navy-30);
      transition:
        background    180ms ease,
        box-shadow    180ms ease,
        transform     120ms ease;
    }

    .cta-btn:hover {
      background: var(--accent);
      box-shadow: 0 6px 24px rgba(43,77,179,.4);
      transform: translateY(-2px);
    }

    .cta-btn:active { transform: translateY(0) scale(.97); }

    .cta-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .cta-btn svg { width: 16px; height: 16px; }

    /* ── Back to top ─────────────────────────────────────────────────── */
    .back-top {
      position: fixed;
      bottom: 2rem;
      right: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--navy);
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px var(--navy-30);
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition:
        opacity   250ms ease,
        transform 250ms var(--ease-out);
      z-index: 100;
    }

    .back-top.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .back-top:hover {
      background: var(--accent);
      box-shadow: 0 6px 20px rgba(43,77,179,.4);
    }

    .back-top:active { transform: scale(.93); }

    .back-top:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .back-top svg { width: 18px; height: 18px; }

    /* ── Toast ───────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--navy);
      color: #fff;
      font-size: .85rem;
      font-weight: 600;
      padding: .65rem 1.25rem;
      border-radius: 999px;
      box-shadow: 0 4px 16px var(--navy-30);
      opacity: 0;
      pointer-events: none;
      transition:
        opacity   250ms ease,
        transform 250ms var(--ease-out);
      z-index: 200;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Scrollbar (Webkit) ──────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--navy-30);
      border-radius: 999px;
    }

    /* ── Reduced motion ──────────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .faq-item,
      .faq-item--entering,
      .faq-body,
      .faq-icon,
      .faq-icon svg,
      .faq-icon-v,
      .back-top,
      .toast,
      .cat-btn,
      .cta-btn,
      .hero__badge-dot {
        transition: none !important;
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .faq-body { grid-template-rows: 0fr; }
      .faq-item.is-open .faq-body { grid-template-rows: 1fr; }
    }

    /* ── Responsive ──────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .hero { padding: 2rem 1rem 2.5rem; }
      .hero__title { font-size: clamp(1.9rem, 9vw, 2.75rem); }
      .content { padding: 0 1rem 5rem; }
      .search-hint { display: none; }
      .search-clear { right: 1rem; }
      .search-input { padding-right: 2.8rem; }
      .cta-section { padding: 2rem 1.25rem; }
      .back-top { bottom: 1.5rem; right: 1rem; }
    }
  </style>
</head>
<body>

<!-- ── Hero ───────────────────────────────────────────────────────────── -->
<header class="hero" role="banner">
  <div class="hero__inner">
    <div class="hero__badge" aria-label="FAQ section">
      <span class="hero__badge-dot" aria-hidden="true"></span>
      FAQs
    </div>
    <h1 class="hero__title">What can we<br>help you with?</h1>
    <p class="hero__sub">Everything you need to know. Can't find an answer? Chat with our team.</p>

    <!-- Search -->
    <div class="search-wrap" role="search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        id="searchInput"
        type="search"
        class="search-input"
        placeholder="Search questions..."
        aria-label="Search FAQ questions"
        aria-controls="faqList"
        aria-describedby="resultsMeta"
        autocomplete="off"
        spellcheck="false"
      />
      <button
        id="searchClear"
        class="search-clear"
        aria-label="Clear search"
        tabindex="-1"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div class="search-hint" aria-hidden="true">
        <span class="kbd">/</span>
      </div>
    </div>
  </div>
</header>

<!-- ── Main content ───────────────────────────────────────────────────── -->
<main>
  <div class="content">

    <!-- Category filters -->
    <nav class="categories" id="categories" aria-label="FAQ categories">
      <!-- injected by JS -->
    </nav>

    <!-- Results meta -->
    <p class="results-meta" id="resultsMeta" aria-live="polite" aria-atomic="true"></p>

    <!-- FAQ accordion -->
    <section id="faqList" class="faq-list" aria-label="FAQ list">
      <!-- injected by JS -->
    </section>

    <!-- CTA -->
    <div class="cta-section" id="ctaSection">
      <div class="cta-section__inner">
        <div class="cta-section__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <h2 class="cta-section__title">Still have questions?</h2>
        <p class="cta-section__sub">Can't find what you're looking for? Our friendly team is here to help.</p>
        <button class="cta-btn" onclick="showToast('Opening support chat…')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          Chat with us
        </button>
      </div>
    </div>

  </div>
</main>

<!-- Back to top -->
<button class="back-top" id="backTop" aria-label="Scroll back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <polyline points="18 15 12 9 6 15"/>
  </svg>
</button>

<!-- Toast notification -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ─── Data ──────────────────────────────────────────────────────────── */
var FAQ_DATA = [
  {
    id: 1,
    category: "Pricing",
    question: "Is there a free trial available?",
    answer: "Yes, you can try us for free for 30 days. If you want, we'll provide you with a free 30-minute onboarding call to get you up and running as quickly as possible."
  },
  {
    id: 2,
    category: "Plans",
    question: "Can I change my plan later?",
    answer: "Of course! Our pricing scales with your company. Chat to our friendly team to find a solution that works for you as you grow. You can upgrade or downgrade at any time from your account settings."
  },
  {
    id: 3,
    category: "Billing",
    question: "What is your cancellation policy?",
    answer: "We understand that things change. You can cancel your plan at any time and we'll refund you the difference already paid. No questions asked — we want you to be happy with your choice."
  },
  {
    id: 4,
    category: "Billing",
    question: "Can other info be added to an invoice?",
    answer: "At the moment, the only way to add additional information to invoices is to add the information to the workspace's name manually. We're working on a full invoice customisation feature — stay tuned!"
  },
  {
    id: 5,
    category: "Pricing",
    question: "What does \"lifetime access\" mean?",
    answer: "Once you have purchased the UI kit, you will have access to all of the future updates, free of charge. We'll let you know about releases via email and in-app notifications. There is no annual renewal fee."
  },
  {
    id: 6,
    category: "Pricing",
    question: "Is it a one-time payment?",
    answer: "Just a one-time payment! No recurring charges or surprises, we promise. We're just as sick of recurring charges as you are. Pay once, use forever."
  },
  {
    id: 7,
    category: "Account",
    question: "How do I reset my password?",
    answer: "You can reset your password from the login screen by clicking \"Forgot password\". We'll send a reset link to your registered email address. The link expires after 24 hours for security. If you don't receive the email, check your spam folder."
  },
  {
    id: 8,
    category: "Account",
    question: "Can I have multiple users on one account?",
    answer: "Yes! Our Team and Enterprise plans support multiple seats. Each user gets their own login credentials and personalised settings. Admins can manage permissions, add or remove members, and view usage across all seats from the dashboard."
  },
  {
    id: 9,
    category: "Plans",
    question: "What is included in the Enterprise plan?",
    answer: "The Enterprise plan includes everything in Team, plus: SSO/SAML authentication, dedicated account manager, custom SLAs, audit logs, advanced role-based access control, and priority 24/7 support. Contact us for custom pricing."
  },
  {
    id: 10,
    category: "Plans",
    question: "Do you offer discounts for non-profits or education?",
    answer: "Absolutely. We offer a 50% discount for verified non-profit organisations and educational institutions. Simply contact our support team with proof of your status and we'll apply the discount to your account within one business day."
  },
  {
    id: 11,
    category: "Account",
    question: "How do I delete my account?",
    answer: "You can request account deletion from Settings → Account → Delete Account. Your data will be permanently removed within 30 days in accordance with our data retention policy. This action is irreversible, so please make sure you've exported any data you need beforehand."
  },
  {
    id: 12,
    category: "Billing",
    question: "Which payment methods do you accept?",
    answer: "We accept all major credit and debit cards (Visa, Mastercard, Amex, Discover), PayPal, and bank transfers for annual Enterprise contracts. All payments are processed securely via Stripe. We do not store card details on our servers."
  }
];

/* Derive category list */
var ALL_CATEGORIES = ["All"];
var catSet = {};
FAQ_DATA.forEach(function(item) {
  if (!catSet[item.category]) {
    catSet[item.category] = true;
    ALL_CATEGORIES.push(item.category);
  }
});

/* Category counts */
function getCatCount(cat) {
  if (cat === "All") return FAQ_DATA.length;
  return FAQ_DATA.filter(function(i) { return i.category === cat; }).length;
}

/* ─── State ─────────────────────────────────────────────────────────── */
var state = {
  query:       "",
  activeCategory: "All",
  openIds:     {},
  votes:       {}
};

/* ─── DOM refs ──────────────────────────────────────────────────────── */
var searchInput  = document.getElementById("searchInput");
var searchClear  = document.getElementById("searchClear");
var categoriesEl = document.getElementById("categories");
var resultsMeta  = document.getElementById("resultsMeta");
var faqList      = document.getElementById("faqList");
var backTop      = document.getElementById("backTop");
var toastEl      = document.getElementById("toast");
var ctaSection   = document.getElementById("ctaSection");

/* ─── Utilities ─────────────────────────────────────────────────────── */
function debounce(fn, delay) {
  var timer;
  return function() {
    var args = arguments;
    clearTimeout(timer);
    timer = setTimeout(function() { fn.apply(null, args); }, delay);
  };
}

function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function highlightText(text, query) {
  if (!query) return escapeHtml(text);
  var safePattern = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  var regex = new RegExp("(" + safePattern + ")", "gi");
  return text.split(regex).map(function(part, i) {
    return i % 2 === 1
      ? "<mark>" + escapeHtml(part) + "</mark>"
      : escapeHtml(part);
  }).join("");
}

var toastTimer;
function showToast(msg, duration) {
  duration = duration || 2200;
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() {
    toastEl.classList.remove("show");
  }, duration);
}

/* ─── Filter ────────────────────────────────────────────────────────── */
function getFilteredData() {
  var q   = state.query.toLowerCase();
  var cat = state.activeCategory;
  return FAQ_DATA.filter(function(item) {
    var matchesCat = cat === "All" || item.category === cat;
    if (!matchesCat) return false;
    if (!q) return true;
    return (
      item.question.toLowerCase().indexOf(q) !== -1 ||
      item.answer.toLowerCase().indexOf(q) !== -1
    );
  });
}

/* ─── Category tabs ─────────────────────────────────────────────────── */
function renderCategories() {
  categoriesEl.innerHTML = "";
  ALL_CATEGORIES.forEach(function(cat) {
    var btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === state.activeCategory ? " active" : "");
    btn.setAttribute("aria-pressed", String(cat === state.activeCategory));
    btn.setAttribute("data-cat", cat);

    var count = getCatCount(cat);
    btn.innerHTML =
      escapeHtml(cat) +
      '<span class="cat-count">' + count + '</span>';

    btn.addEventListener("click", function() {
      state.activeCategory = cat;
      renderCategories();
      renderFAQs();
    });

    categoriesEl.appendChild(btn);
  });
}

/* ─── FAQ accordion ─────────────────────────────────────────────────── */
function toggleItem(id) {
  state.openIds[id] = !state.openIds[id];
  var item  = document.getElementById("faq-item-" + id);
  var body  = document.getElementById("faq-body-" + id);
  var trigger = document.getElementById("faq-trigger-" + id);
  if (!item) return;
  var isOpen = state.openIds[id];
  item.classList.toggle("is-open", isOpen);
  trigger.setAttribute("aria-expanded", String(isOpen));
  body.setAttribute("aria-hidden", String(!isOpen));
}

function renderFAQs() {
  var items = getFilteredData();
  faqList.innerHTML = "";

  /* Meta text */
  if (state.query) {
    resultsMeta.textContent = items.length
      ? items.length + " result" + (items.length !== 1 ? "s" : "") + " for “" + state.query + "”"
      : "";
  } else {
    resultsMeta.textContent = items.length + " question" + (items.length !== 1 ? "s" : "");
  }

  /* Empty state */
  if (items.length === 0) {
    faqList.innerHTML =
      '<div class="empty-state" role="status">' +
        '<div class="empty-icon" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
            '<circle cx="11" cy="11" r="8"/>' +
            '<line x1="21" y1="21" x2="16.65" y2="16.65"/>' +
            '<line x1="8" y1="11" x2="14" y2="11"/>' +
          '</svg>' +
        '</div>' +
        '<p class="empty-state__title">No results found</p>' +
        '<p class="empty-state__sub">Try a different keyword, or browse a category.</p>' +
        '<div class="empty-state__suggestions">' +
          '<button class="suggestion-chip" data-suggest="free trial">free trial</button>' +
          '<button class="suggestion-chip" data-suggest="pricing">pricing</button>' +
          '<button class="suggestion-chip" data-suggest="cancel">cancel</button>' +
          '<button class="suggestion-chip" data-suggest="invoice">invoice</button>' +
        '</div>' +
      '</div>';

    faqList.querySelectorAll(".suggestion-chip").forEach(function(chip) {
      chip.addEventListener("click", function() {
        var term = chip.getAttribute("data-suggest");
        searchInput.value = term;
        state.query = term;
        updateClearBtn();
        renderFAQs();
      });
    });
    return;
  }

  /* Render items */
  items.forEach(function(item, index) {
    var isOpen  = !!state.openIds[item.id];
    var vote    = state.votes[item.id];

    var el = document.createElement("div");
    el.className = "faq-item faq-item--entering" + (isOpen ? " is-open" : "");
    el.id = "faq-item-" + item.id;
    el.setAttribute("data-id", String(item.id));

    /* Stagger delay */
    el.style.transitionDelay = (index * 45) + "ms";

    /* Helpful buttons HTML */
    var helpfulHtml;
    if (vote) {
      helpfulHtml =
        '<span class="faq-helpful__thanks">Thanks for your feedback!</span>';
    } else {
      helpfulHtml =
        '<span class="faq-helpful__label">Was this helpful?</span>' +
        '<button class="helpful-btn" data-vote="yes" data-faq-id="' + item.id + '" aria-label="Yes, this was helpful">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/>' +
            '<path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>' +
          '</svg>' +
          'Yes' +
        '</button>' +
        '<button class="helpful-btn" data-vote="no" data-faq-id="' + item.id + '" aria-label="No, this was not helpful">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/>' +
            '<path d="M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/>' +
          '</svg>' +
          'No' +
        '</button>';
    }

    el.innerHTML =
      '<button class="faq-trigger" id="faq-trigger-' + item.id + '"' +
        ' aria-expanded="' + isOpen + '"' +
        ' aria-controls="faq-body-' + item.id + '"' +
      '>' +
        '<span class="faq-question">' + highlightText(item.question, state.query) + '</span>' +
        '<span class="faq-icon" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"' +
               ' stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
            '<line x1="12" y1="5" x2="12" y2="19" class="faq-icon-v"/>' +
            '<line x1="5" y1="12" x2="19" y2="12"/>' +
          '</svg>' +
        '</span>' +
      '</button>' +
      '<div class="faq-body" id="faq-body-' + item.id + '"' +
           ' role="region"' +
           ' aria-labelledby="faq-trigger-' + item.id + '"' +
           ' aria-hidden="' + !isOpen + '"' +
      '>' +
        '<div class="faq-body-inner">' +
          '<div class="faq-answer-wrap">' +
            '<p class="faq-answer">' + highlightText(item.answer, state.query) + '</p>' +
            '<div class="faq-helpful">' + helpfulHtml + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    /* Trigger click */
    (function(faqId) {
      el.querySelector(".faq-trigger").addEventListener("click", function() {
        toggleItem(faqId);
      });
    })(item.id);

    /* Helpful votes */
    el.querySelectorAll(".helpful-btn").forEach(function(btn) {
      btn.addEventListener("click", function(e) {
        e.stopPropagation();
        var faqId = parseInt(btn.getAttribute("data-faq-id"), 10);
        var vote  = btn.getAttribute("data-vote");
        state.votes[faqId] = vote;
        var msg = vote === "yes" ? "Thanks! Glad that helped." : "Thanks for the feedback — we'll improve this.";
        showToast(msg);
        /* Re-render just the helpful widget */
        var helpfulDiv = el.querySelector(".faq-helpful");
        if (helpfulDiv) {
          helpfulDiv.innerHTML = '<span class="faq-helpful__thanks">Thanks for your feedback!</span>';
        }
      });
    });

    faqList.appendChild(el);

    /* Entry animation */
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        el.classList.remove("faq-item--entering");
        el.addEventListener("transitionend", function clearDelay(evt) {
          if (evt.propertyName === "opacity") {
            el.style.transitionDelay = "";
            el.removeEventListener("transitionend", clearDelay);
          }
        });
      });
    });
  });
}

/* ─── Search ────────────────────────────────────────────────────────── */
function updateClearBtn() {
  searchClear.classList.toggle("visible", state.query.length > 0);
  searchClear.tabIndex = state.query.length > 0 ? 0 : -1;
}

searchInput.addEventListener("input", debounce(function() {
  state.query = searchInput.value.trim();
  updateClearBtn();
  renderFAQs();
}, 200));

searchClear.addEventListener("click", function() {
  searchInput.value = "";
  state.query = "";
  updateClearBtn();
  renderFAQs();
  searchInput.focus();
});

/* ─── Keyboard shortcuts ─────────────────────────────────────────────── */
document.addEventListener("keydown", function(e) {
  var active = document.activeElement;
  var tag = active ? active.tagName.toLowerCase() : "";
  var inInput = tag === "input" || tag === "textarea" || (active && active.isContentEditable);

  /* / to focus search */
  if (e.key === "/" && !inInput) {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
    return;
  }

  /* Esc clears search (while focused) */
  if (e.key === "Escape" && inInput) {
    searchInput.value = "";
    state.query = "";
    updateClearBtn();
    renderFAQs();
    searchInput.blur();
    return;
  }

  /* Arrow keys navigate FAQ triggers */
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && !inInput) {
    var triggers = Array.from(faqList.querySelectorAll(".faq-trigger"));
    if (!triggers.length) return;
    var idx = triggers.indexOf(document.activeElement);
    if (e.key === "ArrowDown") idx = idx < triggers.length - 1 ? idx + 1 : 0;
    else idx = idx > 0 ? idx - 1 : triggers.length - 1;
    e.preventDefault();
    triggers[idx].focus();
  }
});

/* ─── Back to top ────────────────────────────────────────────────────── */
window.addEventListener("scroll", debounce(function() {
  backTop.classList.toggle("visible", window.scrollY > 400);
}, 80), { passive: true });

backTop.addEventListener("click", function() {
  window.scrollTo({ top: 0, behavior: "smooth" });
});

/* ─── Boot ──────────────────────────────────────────────────────────── */
renderCategories();
renderFAQs();

/* Open first item by default */
if (FAQ_DATA.length > 0) {
  state.openIds[FAQ_DATA[0].id] = true;
  var firstItem = document.getElementById("faq-item-" + FAQ_DATA[0].id);
  if (firstItem) {
    firstItem.classList.add("is-open");
    var firstTrigger = document.getElementById("faq-trigger-" + FAQ_DATA[0].id);
    if (firstTrigger) firstTrigger.setAttribute("aria-expanded", "true");
    var firstBody = document.getElementById("faq-body-" + FAQ_DATA[0].id);
    if (firstBody) firstBody.setAttribute("aria-hidden", "false");
  }
}
</script>

</body>
</html>
